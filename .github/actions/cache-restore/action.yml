name: 'CI cache restore'
description: >
  Restore vcpkg binary archives and/or ccache from Actions cache (+ optional
  public GHCR tip for vcpkg). Paths: workspace/.cache/{vcpkg,ccache}.
inputs:
  kind:
    description: 'vcpkg | ccache | both'
    required: false
    default: both
  os:
    description: 'linux | macos | windows | wasm'
    required: true
  triplet:
    description: 'vcpkg triplet (required when kind includes vcpkg)'
    required: false
    default: ''
  scope:
    description: 'ccache product scope (client | pack | crystal | qt)'
    required: false
    default: client
  baseline:
    description: 'vcpkg builtin-baseline (full SHA or empty to read vcpkg.json)'
    required: false
    default: ''
  vcpkg_json:
    description: 'Path to vcpkg.json relative to github.workspace'
    required: false
    default: vcpkg.json
  ghcr_vcpkg:
    description: 'GHCR image for shared vcpkg (e.g. ghcr.io/qtclient/vcpkg-cache); empty = Actions only'
    required: false
    default: ''
  unique:
    description: 'Unique Actions primary-key suffix so each run can save a new tip'
    required: false
    default: ${{ github.sha }}
outputs:
  vcpkg-cache-hit:
    description: 'true when Actions exact vcpkg key hit'
    value: ${{ steps.vcpkg.outputs.cache-hit }}
  ccache-hit:
    description: 'true when Actions exact ccache key hit'
    value: ${{ steps.ccache.outputs.cache-hit }}
  vcpkg_dir:
    value: ${{ steps.paths.outputs.vcpkg_dir }}
  ccache_dir:
    value: ${{ steps.paths.outputs.ccache_dir }}
  vcpkg_key:
    value: ${{ steps.paths.outputs.vcpkg_key }}
  ccache_key:
    value: ${{ steps.paths.outputs.ccache_key }}
  baseline12:
    value: ${{ steps.paths.outputs.baseline12 }}
  tip_tag:
    value: ${{ steps.paths.outputs.tip_tag }}

runs:
  using: composite
  steps:
    - name: Resolve cache paths + keys
      id: paths
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        OS_SLUG: ${{ inputs.os }}
        TRIPLET: ${{ inputs.triplet }}
        SCOPE: ${{ inputs.scope }}
        BASELINE_IN: ${{ inputs.baseline }}
        VCPKG_JSON: ${{ inputs.vcpkg_json }}
        UNIQUE: ${{ inputs.unique }}
      run: |
        set -euo pipefail
        # shellcheck source=../cache-common.sh
        source "${{ github.action_path }}/../cache-common.sh"
        VCPKG_DIR="${GITHUB_WORKSPACE}/.cache/vcpkg"
        CCACHE_DIR_PATH="${GITHUB_WORKSPACE}/.cache/ccache"
        mkdir -p "$VCPKG_DIR" "$CCACHE_DIR_PATH"
        cache_export_env "$VCPKG_DIR" "$CCACHE_DIR_PATH"
        BASELINE12=""
        TIP_TAG=""
        VCPKG_KEY=""
        if cache_kind_has "$KIND" vcpkg; then
          [[ -n "$TRIPLET" ]] || { echo "::error::triplet required for vcpkg"; exit 1; }
          BASELINE12="$(cache_baseline12 "$BASELINE_IN" "$GITHUB_WORKSPACE/$VCPKG_JSON")"
          VCPKG_KEY="vcpkg-${TRIPLET}-${BASELINE12}-${UNIQUE}"
          TIP_TAG="${TRIPLET}-${BASELINE12}"
        fi
        CCACHE_KEY="ccache-${SCOPE}-${OS_SLUG}-${UNIQUE}"
        {
          echo "vcpkg_dir=$VCPKG_DIR"
          echo "ccache_dir=$CCACHE_DIR_PATH"
          echo "vcpkg_key=$VCPKG_KEY"
          echo "ccache_key=$CCACHE_KEY"
          echo "baseline12=$BASELINE12"
          echo "tip_tag=$TIP_TAG"
        } >> "$GITHUB_OUTPUT"
        echo "[ci-cache] restore kind=$KIND os=$OS_SLUG triplet=${TRIPLET:--} scope=$SCOPE"

    - name: Restore vcpkg (Actions)
      id: vcpkg
      if: inputs.kind == 'vcpkg' || inputs.kind == 'both'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.vcpkg_dir }}
        key: ${{ steps.paths.outputs.vcpkg_key }}
        restore-keys: |
          vcpkg-${{ inputs.triplet }}-${{ steps.paths.outputs.baseline12 }}-
          vcpkg-${{ inputs.triplet }}-
          vcpkg-bin-${{ inputs.triplet }}-

    - name: Merge vcpkg from GHCR tip
      if: (inputs.kind == 'vcpkg' || inputs.kind == 'both') && inputs.ghcr_vcpkg != ''
      shell: bash
      env:
        GHCR_IMAGE: ${{ inputs.ghcr_vcpkg }}
        TIP_TAG: ${{ steps.paths.outputs.tip_tag }}
        DEST: ${{ steps.paths.outputs.vcpkg_dir }}
      run: |
        set -euo pipefail
        # shellcheck source=../cache-common.sh
        source "${{ github.action_path }}/../cache-common.sh"
        # Anonymous pull for public Soft packages (idleot tokens 403 cross-org).
        oras logout ghcr.io 2>/dev/null || true
        cache_oras_pull_vcpkg "$GHCR_IMAGE" "$TIP_TAG" "$DEST"

    - name: Restore ccache (Actions)
      id: ccache
      if: inputs.kind == 'ccache' || inputs.kind == 'both'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.ccache_dir }}
        key: ${{ steps.paths.outputs.ccache_key }}
        restore-keys: |
          ccache-${{ inputs.scope }}-${{ inputs.os }}-
          ccache-${{ inputs.scope }}-${{ inputs.os }}
          ccache-client-${{ inputs.os }}-
          ccache-client-${{ inputs.os }}
          ccache-pack-${{ inputs.os }}
          ccache-pack-wasm
