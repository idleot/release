---
# Publish the Linux OS/deps builder image (optional speedup for local/CI).
# Qt is still installed via install-qt.sh into a cache; this image carries
# apt deps + ccache. Rebuild when Dockerfile.builder-linux changes.
name: Build client-builder-linux

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - Dockerfile.builder-linux
      - .github/workflows/build-builder.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  push:
    name: Push builder image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder-linux
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/client-builder-linux:latest
            ${{ env.REGISTRY }}/client-builder-linux:${{ github.sha }}
          cache-from: type=gha,scope=client-builder-linux
          cache-to: type=gha,scope=client-builder-linux,mode=max
