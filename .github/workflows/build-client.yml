---
# Build the release clients (browser WASM + desktop Linux/Windows/macOS) from
# private idleot/otclient at a pinned SHA and push them as private, files-only
# slice images tagged :<sha>. Nothing is promoted here — release.yml hands the
# tags to bundle.yml after the server is live.
#
# This repo is public (free runners), so:
#   - Lua/OTUI ship encrypted (OTC_ENCRYPTION_* secrets, encrypt_assets.py).
#   - Compiler output goes to files; logs show only an error summary.
#   - No layer/compiler caches of product code; only third-party vcpkg/emsdk.
#   - Artifacts hold only the encrypted installers + updater file tree the CDN
#     publishes anyway.
#
# Desktop installers: Windows Inno Setup (per-user), macOS DMG, Linux AppImage.
# Code signing turns on by itself once its secrets exist (unsigned otherwise):
#   Windows (Azure Trusted Signing): AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET + vars TRUSTED_SIGNING_ENDPOINT,
#     TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
#   macOS (Developer ID + notarization): MACOS_CERTIFICATE_P12 (base64),
#     MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID,
#     APPLE_APP_PASSWORD
name: Build client

run-name: Build client ${{ inputs.otclient_sha }} ${{ inputs.release_id }}

on:
  workflow_call:
    inputs:
      otclient_sha:
        type: string
        required: true
      release_id:
        type: string
        default: ""
    outputs:
      revision:
        value: ${{ jobs.check.outputs.revision }}
  workflow_dispatch:
    inputs:
      otclient_sha:
        description: idleot/otclient commit SHA (full)
        required: true
      release_id:
        description: Correlation id (set by release.yml)
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  SHA: ${{ inputs.otclient_sha }}

jobs:
  check:
    name: Check existing slices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wasm: ${{ steps.exists.outputs.wasm }}
      desktop: ${{ steps.exists.outputs.desktop }}
      revision: ${{ steps.exists.outputs.revision }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look up :sha tags
        id: exists
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::otclient_sha must be a full commit SHA"; exit 1; }
          for slice in wasm desktop; do
            if docker buildx imagetools inspect "$REGISTRY/otclient-$slice:$SHA" >/dev/null 2>&1; then
              echo "$slice=true" >> "$GITHUB_OUTPUT"; echo "otclient-$slice:$SHA exists — skipping"
            else
              echo "$slice=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "revision=$(date -u +%Y%m%d)-${SHA::7}" >> "$GITHUB_OUTPUT"

  wasm:
    name: WASM
    needs: [check]
    if: needs.check.outputs.wasm != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    steps:
      - name: Checkout otclient
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/otclient
          ref: ${{ env.SHA }}
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false

      - name: Write encryption secret
        env:
          OTC_ENCRYPTION_PASSWORD: ${{ secrets.OTC_ENCRYPTION_PASSWORD }}
          OTC_ENCRYPTION_HEADER: ${{ secrets.OTC_ENCRYPTION_HEADER }}
        run: |
          umask 077
          printf 'OTC_ENCRYPTION_PASSWORD=%s\nOTC_ENCRYPTION_HEADER=%s\n' \
            "$OTC_ENCRYPTION_PASSWORD" "$OTC_ENCRYPTION_HEADER" > "$RUNNER_TEMP/otc_encryption"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore third-party cache mounts
        id: mounts
        uses: actions/cache@v4
        with:
          path: buildkit-mounts
          key: wasm-mounts-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.SHA }}
          restore-keys: |
            wasm-mounts-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            wasm-mounts-

      - name: Inject cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
          cache-map: |
            {
              "buildkit-mounts/vcpkg-binaries": { "target": "/var/cache/vcpkg-binaries", "id": "idleot-vcpkg-binaries" },
              "buildkit-mounts/vcpkg-downloads": { "target": "/var/cache/vcpkg-downloads", "id": "idleot-vcpkg-downloads" },
              "buildkit-mounts/emsdk": { "target": "/var/cache/emsdk", "id": "idleot-emsdk" },
              "buildkit-mounts/emsdk-compile": { "target": "/var/cache/emsdk-compile", "id": "idleot-emsdk-compile" }
            }

      - name: Build and push otclient-wasm:${{ env.SHA }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: artifact
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/otclient-wasm:${{ env.SHA }}
          secret-files: |
            otc_encryption=${{ runner.temp }}/otc_encryption
          build-args: |
            SOURCE_COMMIT=${{ env.SHA }}
            IDLEOT_QUIET_BUILD=1
            IDLEOT_EXTRA_CFLAGS=-w -fno-caret-diagnostics

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: [check]
    if: needs.check.outputs.desktop != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            preset: linux-release
            triplet: x64-linux-release
            cflags: -w -fno-diagnostics-show-caret
          # windows-release already uses the release-only x64-windows-static-release overlay.
          - platform: windows-x64
            os: windows-2025-vs2026
            preset: windows-release
            triplet: ""
            # Dash form: Git Bash rewrites "/w" in env vars to the path "W:/".
            cflags: -w
          - platform: macos-arm64
            os: macos-15
            preset: macos-release
            triplet: arm64-osx-release
            cflags: -w -fno-caret-diagnostics
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    environment: release
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
      CFLAGS: ${{ matrix.cflags }}
      CXXFLAGS: ${{ matrix.cflags }}
      PYTHONUTF8: "1"
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      APPIMAGETOOL_VERSION: "1.9.1"
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
    steps:
      # Runtime files must be byte-identical across platforms: update.json
      # checksums come from the Linux build.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout otclient
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/otclient
          ref: ${{ env.SHA }}
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false

      - name: Get vcpkg baseline
        shell: bash
        run: |
          commit="$(grep '"builtin-baseline"' vcpkg.json | awk -F: '{print $2}' | tr -d '," \r')"
          echo "VCPKG_GIT_COMMIT_ID=${commit}" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-bincache

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf autoconf-archive automake gcc-14 g++-14 \
            libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libtool libtool-bin \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            linux-libc-dev make ninja-build perl pkg-config >/dev/null
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $tool" | sha256sum -c -
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Remove Windows pre-installed MySQL
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\mysql* -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-bincache
          key: vcpkg-desktop-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.SHA }}
          restore-keys: |
            vcpkg-desktop-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-desktop-${{ matrix.platform }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Write encryption header
        shell: bash
        env:
          OTC_ENCRYPTION_PASSWORD: ${{ secrets.OTC_ENCRYPTION_PASSWORD }}
          OTC_ENCRYPTION_HEADER: ${{ secrets.OTC_ENCRYPTION_HEADER }}
        run: python3 tools/publish/encrypt_assets.py header src/framework/idleot_encryption.h

      - name: Configure and build (quiet)
        shell: bash
        run: |
          summary() {
            echo "::group::error summary ($1)"
            grep -E "(error|Error|FAILED|CMake Error)" "$1" | grep -vE "^[[:space:]]*(-|#)" | cut -c1-400 | tail -n 60
            echo "::endgroup::"
          }
          args=(-DTOGGLE_BIN_FOLDER=ON -DOPTIONS_ENABLE_IPO=OFF -DOTCLIENT_BUILD_TESTS=OFF)
          if [[ -n "${{ matrix.triplet }}" ]]; then
            args+=("-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" "-DVCPKG_HOST_TRIPLET=${{ matrix.triplet }}")
          fi
          if ! cmake --preset "${{ matrix.preset }}" "${args[@]}" > "$RUNNER_TEMP/configure.log" 2>&1; then
            summary "$RUNNER_TEMP/configure.log"; exit 1
          fi
          echo "configure ok ($(wc -l < "$RUNNER_TEMP/configure.log") lines suppressed)"
          if ! cmake --build --preset "${{ matrix.preset }}" > "$RUNNER_TEMP/build.log" 2>&1; then
            summary "$RUNNER_TEMP/build.log"; exit 1
          fi
          echo "build ok ($(wc -l < "$RUNNER_TEMP/build.log") lines suppressed)"
          rm -f src/framework/idleot_encryption.h

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Stage runtime into IdleOT.app
        if: runner.os == 'macOS'
        env:
          SOURCE_COMMIT: ${{ env.SHA }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://cdn.idleot.com' }}
          OTC_ENCRYPTION_PASSWORD: ${{ secrets.OTC_ENCRYPTION_PASSWORD }}
          OTC_ENCRYPTION_HEADER: ${{ secrets.OTC_ENCRYPTION_HEADER }}
        run: |
          python3 tools/publish/package_desktop.py --platform macos-arm64 --bin "build/${{ matrix.preset }}/bin" \
            --revision "${{ needs.check.outputs.revision }}" --stage-bundle --engine-out "build/${{ matrix.preset }}/engine"

      - name: Ad-hoc sign app bundle
        if: runner.os == 'macOS' && env.MACOS_SIGNING != 'true'
        run: |
          cd build/${{ matrix.preset }}/bin
          xattr -cr IdleOT.app ../engine/IdleOT.app
          codesign --force --deep --sign - IdleOT.app ../engine/IdleOT.app

      - name: Developer ID sign app bundle
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          cd build/${{ matrix.preset }}/bin
          xattr -cr IdleOT.app ../engine/IdleOT.app
          codesign --force --deep --options runtime --timestamp \
            --entitlements "$GITHUB_WORKSPACE/tools/publish/installer/idleot.entitlements" \
            --sign "$MACOS_SIGN_IDENTITY" IdleOT.app ../engine/IdleOT.app

      - name: Sign client executable
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: build/${{ matrix.preset }}/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package installer
        shell: bash
        env:
          SOURCE_COMMIT: ${{ env.SHA }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://cdn.idleot.com' }}
          OTC_ENCRYPTION_PASSWORD: ${{ secrets.OTC_ENCRYPTION_PASSWORD }}
          OTC_ENCRYPTION_HEADER: ${{ secrets.OTC_ENCRYPTION_HEADER }}
        run: |
          extra=(--engine-files)
          # The runtime tree is platform-independent; publish it once.
          [[ "${{ matrix.platform }}" == linux-x64 ]] && extra+=(--update-files --content-files)
          [[ "${{ matrix.platform }}" == macos-arm64 ]] && extra+=(--engine-app "build/${{ matrix.preset }}/engine/IdleOT.app")
          python3 tools/publish/package_desktop.py --platform "${{ matrix.platform }}" \
            --bin "build/${{ matrix.preset }}/bin" --out "$RUNNER_TEMP/dist" \
            --revision "${{ needs.check.outputs.revision }}" "${extra[@]}"

      - name: Sign installer
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}/dist/desktop
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Notarize DMG
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="$(find "$RUNNER_TEMP/dist/desktop" -name '*.dmg' | head -n1)"
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"

      - name: Refresh signed installer checksum
        if: (runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true') || (runner.os == 'macOS' && env.MACOS_SIGNING == 'true')
        shell: bash
        run: python3 tools/publish/package_desktop.py --platform "${{ matrix.platform }}" --out "$RUNNER_TEMP/dist" --refresh-pointer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  desktop-publish:
    name: Push otclient-desktop
    needs: [check, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: parts

      - name: Merge platforms
        run: |
          mkdir -p slice/.idleot/v3 slice/content
          for d in parts/desktop-*; do
            cp -R "$d/desktop" slice/
            cp -R "$d/content/." slice/content/
            cp "$d"/.idleot/v3/*.json slice/.idleot/v3/
          done
          python3 - <<'PY'
          import json, pathlib, shutil
          merged = None
          for p in sorted(pathlib.Path("parts").glob("desktop-*/.idleot/desktop.json")):
              d = json.loads(p.read_text())
              if merged is None:
                  merged = d
              else:
                  merged["platforms"].update(d["platforms"])
          pathlib.Path("slice/.idleot/desktop.json").write_text(json.dumps(merged, indent=2) + "\n")
          print(json.dumps(merged, indent=2))
          updates = sorted(pathlib.Path("parts").glob("desktop-*/.idleot/update.json"))
          if not updates:
              raise SystemExit("no .idleot/update.json in the desktop artifacts")
          shutil.copy(updates[0], "slice/.idleot/update.json")
          u = json.loads(updates[0].read_text())
          print(f"update tree: revision={u['revision']} engine={u['engine']} files={len(u['files'])}")
          v3 = pathlib.Path("slice/.idleot/v3")
          names = ["content-desktop"] + [f"engine-{p}" for p in ("windows-x64", "macos-arm64", "linux-x64")]
          lists = {n: json.loads((v3 / f"{n}.json").read_text()) for n in names}
          if len({(d["revision"], d["engine"]) for d in lists.values()}) != 1:
              raise SystemExit("v3 lists disagree on revision/engine")
          for n, d in lists.items():
              missing = [k for k, f in d["files"].items()
                         if not (pathlib.Path("slice/content") / f["sha256"][:2] / f["sha256"]).is_file()]
              if missing:
                  raise SystemExit(f"{n}: {len(missing)} blobs missing, e.g. {missing[0]}")
              print(f"{n}: {len(d['files'])} files")
          PY
          printf 'FROM scratch\nCOPY . /\n' > Dockerfile.slice

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push otclient-desktop:${{ env.SHA }}
        uses: docker/build-push-action@v6
        with:
          context: slice
          file: Dockerfile.slice
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/otclient-desktop:${{ env.SHA }}
