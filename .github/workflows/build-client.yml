---
# Assemble release client slices from qtclient+IdleOT linked tips built in build-pack.
# qtclient stock host may still be ensured for desktop qtclient ORAS fallbacks; product
# wasm tip is the linked tip artifact (STATIC IdleOT — no SIDE_MODULE merge).
#
# Tip images: otclient-wasm / tibia-desktop tagged by qtclient+pack
#   (${idleot_client_sha}-host-${qtclient_sha}) and aliased to :${qtclient_sha}.
name: Build client

run-name: Assemble client ${{ inputs.qtclient_sha || inputs.otclient_sha }} ${{ inputs.release_id }}

on:
  workflow_call:
    inputs:
      qtclient_sha:
        type: string
        required: false
        default: ""
      otclient_sha:
        type: string
        required: false
        default: ""
        description: Compat alias for qtclient_sha
      idleot_client_sha:
        type: string
        required: false
        default: ""
        description: idleot/idleot-client pack SHA
      release_id:
        type: string
        default: ""
    outputs:
      revision:
        value: ${{ jobs.check.outputs.revision }}
      desktop_image:
        value: ${{ jobs.check.outputs.desktop_image }}
      tip_tag:
        value: ${{ jobs.check.outputs.pack_tag }}
  workflow_dispatch:
    inputs:
      qtclient_sha:
        description: qtclient commit SHA (full); qtclient host artifact tag
        required: false
        default: ""
      otclient_sha:
        description: Compat alias for qtclient_sha
        required: false
        default: ""
      idleot_client_sha:
        description: idleot/idleot-client pack SHA (full)
        required: false
        default: ""
      release_id:
        description: Correlation id (set by release.yml)
        default: ""

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  SHA: ${{ inputs.qtclient_sha || inputs.otclient_sha }}
  IDLEOT_CLIENT_SHA: ${{ inputs.idleot_client_sha }}
  QTCLIENT_REPO: qtclient/qtclient
  IDLEOT_CLIENT_REPO: ${{ github.repository_owner }}/idleot-client
  DESKTOP_IMAGE: tibia-desktop
  HOST_OWNER: qtclient

jobs:
  check:
    name: Ensure qtclient host + tip plan
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      wasm: ${{ steps.exists.outputs.wasm }}
      desktop: ${{ steps.exists.outputs.desktop }}
      revision: ${{ steps.exists.outputs.revision }}
      desktop_image: ${{ steps.exists.outputs.desktop_image }}
      pack_tag: ${{ steps.exists.outputs.pack_tag }}
      need_pack: ${{ steps.exists.outputs.need_pack }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate pins + ensure qtclient host + tip identity
        id: exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id || format('rel-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::qtclient_sha (or otclient_sha) must be a full commit SHA"; exit 1
          }
          echo "desktop_image=$DESKTOP_IMAGE" >> "$GITHUB_OUTPUT"

          if [[ -z "${IDLEOT_CLIENT_SHA}" ]]; then
            echo "::error::idleot_client_sha required (assemble merges pack into tip)"; exit 1
          fi
          [[ "$IDLEOT_CLIENT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::idleot_client_sha must be a full commit SHA"; exit 1
          }
          # Tip identity = qtclient host + IdleOT pack (never qtclient SHA alone).
          pack_tag="${IDLEOT_CLIENT_SHA}-host-${SHA}"
          echo "pack_tag=$pack_tag" >> "$GITHUB_OUTPUT"

          need_pack=false
          for slice in wasm desktop; do
            image="otclient-wasm"
            [[ "$slice" == desktop ]] && image="$DESKTOP_IMAGE"
            if docker buildx imagetools inspect "$REGISTRY/$image:$pack_tag" >/dev/null 2>&1; then
              echo "$slice=true" >> "$GITHUB_OUTPUT"
              echo "$image:$pack_tag exists — skip assemble"
            else
              echo "$slice=false" >> "$GITHUB_OUTPUT"
              need_pack=true
            fi
          done
          echo "need_pack=$need_pack" >> "$GITHUB_OUTPUT"

          echo "revision=$(date -u +%Y%m%d)-${SHA::7}-${IDLEOT_CLIENT_SHA::7}" >> "$GITHUB_OUTPUT"

          # Release-owned qtclient publish when host ORAS missing (parallel with server/portal).
          if [[ "$need_pack" == true ]]; then
            bash scripts/ensure-qtclient-host.sh "$SHA" "$RELEASE_ID"
          fi

  build-pack:
    name: Build IdleOT packs (public)
    needs: [check]
    if: needs.check.outputs.need_pack == 'true'
    uses: ./.github/workflows/build-pack.yml
    secrets: inherit
    with:
      qtclient_sha: ${{ inputs.qtclient_sha || inputs.otclient_sha }}
      idleot_client_sha: ${{ inputs.idleot_client_sha }}
      build_desktop: ${{ needs.check.outputs.desktop != 'true' }}
      build_wasm: ${{ needs.check.outputs.wasm != 'true' }}

  wasm:
    name: Assemble WASM tip
    needs: [check, build-pack]
    if: always() && needs.check.outputs.wasm != 'true' && needs.build-pack.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - name: Checkout release scripts + qtclient pack helpers
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Checkout qtclient (pack-tibia / merge scripts)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ env.SHA }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          sparse-checkout: |
            scripts/lifecycle
            tools/publish
          sparse-checkout-cone-mode: true

      - uses: oras-project/setup-oras@v1

      - name: Checkout idleot-client (launcher brand)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ env.IDLEOT_CLIENT_SHA }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _idleot-client
          persist-credentials: false
          sparse-checkout: |
            launcher
          sparse-checkout-cone-mode: true

      - name: Download linked-tip wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: pack-idleot-wasm
          path: ${{ runner.temp }}/linked-tip

      - name: Brand linked tip + stamp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slice"
          cp -a "$RUNNER_TEMP/linked-tip/." "$RUNNER_TEMP/slice/"
          js="$(find "$RUNNER_TEMP/slice" -name tibia.js | head -1 || true)"
          [[ -n "$js" && -f "$js" ]] || { echo "::error::tibia.js missing in linked tip artifact"; exit 1; }
          tip="$(dirname "$js")"
          test -f "$tip/tibia.wasm" || {
            echo "::error::tibia.wasm missing in linked tip" >&2
            exit 1
          }
          test -f "$tip/mods/idleot/mod.json" || {
            echo "::error::linked tip mods/idleot/mod.json missing" >&2
            exit 1
          }
          if [[ -d "$tip/mods/idleot/native" ]]; then
            echo "::error::native/ must not ship on linked tip" >&2
            exit 1
          fi
          bash _qtclient/scripts/lifecycle/lib/check-tip-pack-presence.sh \
            --tip "$tip" --id idleot --allow-urls-only
          mkdir -p "$RUNNER_TEMP/slice/.idleot"
          if [[ -f "$RUNNER_TEMP/slice/.qtclient/wasm.json" ]]; then
            cp -f "$RUNNER_TEMP/slice/.qtclient/wasm.json" "$RUNNER_TEMP/slice/.idleot/wasm.json"
          fi
          bash _qtclient/scripts/lifecycle/lib/merge-launcher-brand.sh \
            --pack "_idleot-client/launcher" --tip "$tip"
          test -f "$tip/mods/idleot/brand.json" || {
            echo "::error::tip mods/idleot/brand.json missing after merge-launcher-brand" >&2
            exit 1
          }
          SITE="${IDLEOT_SITE_URL:-${TIBIA_SITE_URL:-https://www.idleot.com}}"
          ASSET="${IDLEOT_ASSET_BASE:-${TIBIA_ASSET_BASE:-https://static.idleot.com}}"
          PAY="${QTCLIENT_PAYMENTS_URL:-https://payments.idleot.com}"
          python3 scripts/stamp-mod-urls.py "$tip/mods/idleot/mod.json" \
            --site "$SITE" --asset "$ASSET" --payments "$PAY"
          grep -q '127.0.0.1' "$tip/mods/idleot/mod.json" && {
            echo "::error::tip mod.json still has 127.0.0.1 after stamp" >&2
            exit 1
          }
          python3 scripts/assert-tip-mod-json.py "$tip/mods/idleot/mod.json"
          # Multi-pack aware: stamp every mods/<id>/ under the tip.
          python3 scripts/emit-mods-stamp.py "$tip/mods" "$tip"
          (
            cd "$tip/mods/idleot"
            find . -type f | sed 's|^\./||' | sort
          ) >"$tip/mods/idleot.files"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push otclient-wasm tip (pack + qtclient alias)
        working-directory: ${{ runner.temp }}/slice
        run: |
          printf 'FROM scratch\nCOPY . /\n' > Dockerfile.slice
          pack_tag="${{ needs.check.outputs.pack_tag }}"
          docker buildx build --push --provenance=false --sbom=false \
            -f Dockerfile.slice \
            -t "${{ env.REGISTRY }}/otclient-wasm:${pack_tag}" \
            -t "${{ env.REGISTRY }}/otclient-wasm:${{ env.SHA }}" .

  desktop:
    name: Assemble desktop (${{ matrix.platform }})
    needs: [check, build-pack]
    if: always() && needs.check.outputs.desktop != 'true' && needs.build-pack.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    env:
      PYTHONUTF8: "1"
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      QTCLIENT_APP_NAME: IdleOT
      QTCLIENT_BUNDLE_ID: com.idleot.tibia
      QTCLIENT_STORE_META: .idleot
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Checkout qtclient (publish scripts + packaging)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ env.SHA }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - name: Checkout idleot-client (launcher brand / icons)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ env.IDLEOT_CLIENT_SHA }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _idleot-client
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1

      - name: Download pack artifact
        uses: actions/download-artifact@v4
        with:
          name: pack-idleot-${{ matrix.platform }}
          path: ${{ runner.temp }}/pack/idleot

      - name: Stage linked desktop tip + brand
        shell: bash
        run: |
          set -euo pipefail
          pack="$RUNNER_TEMP/pack/idleot"
          test -f "$pack/mod.json"
          SITE="${IDLEOT_SITE_URL:-${TIBIA_SITE_URL:-https://www.idleot.com}}"
          ASSET="${IDLEOT_ASSET_BASE:-${TIBIA_ASSET_BASE:-https://static.idleot.com}}"
          PAY="${QTCLIENT_PAYMENTS_URL:-https://payments.idleot.com}"
          python3 scripts/stamp-mod-urls.py "$pack/mod.json" \
            --site "$SITE" --asset "$ASSET" --payments "$PAY"
          echo "PACK_DIR=$pack" >> "$GITHUB_ENV"
          mkdir -p _qtclient/client/mods _qtclient/launcher/mods
          cp -a _idleot-client/client _qtclient/client/mods/idleot
          cp -a _idleot-client/launcher _qtclient/launcher/mods/idleot
          # Prefer qtclient tip built with QTCLIENT_LINKED_PACK (pack artifact linked-tip).
          if [[ -d "$RUNNER_TEMP/pack/linked-tip" ]]; then
            cp -a "$RUNNER_TEMP/pack/linked-tip/." "$RUNNER_TEMP/client/"
            tip="$RUNNER_TEMP/client/engine"
            [[ -d "$tip" ]] || tip="$RUNNER_TEMP/client"
            echo "[assemble] using linked qtclient tip from pack artifact"
          else
            oras logout ghcr.io 2>/dev/null || true
            bash scripts/pull-oras-dir.sh \
              "ghcr.io/${HOST_OWNER}/client-${{ matrix.platform }}:${SHA}" \
              "$RUNNER_TEMP/client"
            tip="$RUNNER_TEMP/client/engine"
            [[ -d "$tip" ]] || tip="$RUNNER_TEMP/client"
            echo "::warning::linked-tip missing — merging FS onto qtclient ORAS tip (C++ may be absent)" >&2
            bash _qtclient/scripts/lifecycle/lib/merge-pack-into-tip.sh \
              --pack "$pack" --tip "$tip" --platform "${{ matrix.platform }}"
          fi
          # Ensure FS chrome + brand on tip (linked tip already has mods/idleot).
          if [[ ! -f "$tip/mods/idleot/mod.json" ]] && \
             [[ -z "$(find "$tip" -path '*/Contents/MacOS/mods/idleot/mod.json' 2>/dev/null | head -1)" ]]; then
            bash _qtclient/scripts/lifecycle/lib/merge-pack-into-tip.sh \
              --pack "$pack" --tip "$tip" --platform "${{ matrix.platform }}"
          fi
          bash _qtclient/scripts/lifecycle/lib/merge-launcher-brand.sh \
            --pack "_idleot-client/launcher" --tip "$tip"
          # qtclient merge-pack resolves engine root → Contents/MacOS; prefer that pack.
          # (maxdepth must reach …/Contents/MacOS/mods/idleot/mod.json — depth ≥ 6.)
          pack_tip=""
          macos="$(find "$tip" -path '*/Contents/MacOS/mods/idleot/mod.json' 2>/dev/null | head -1 || true)"
          if [[ -n "$macos" ]]; then
            pack_tip="$(dirname "$macos")"
          elif [[ -f "$tip/mods/idleot/mod.json" ]]; then
            pack_tip="$tip/mods/idleot"
          fi
          test -n "$pack_tip" && test -f "$pack_tip/brand.json" || {
            echo "::error::desktop tip mods/idleot/brand.json missing (tip=$tip)" >&2
            find "$tip" -path '*/mods/idleot/*' 2>/dev/null | head -40 >&2 || true
            exit 1
          }
          python3 scripts/assert-tip-mod-json.py "$pack_tip/mod.json"
          # Stamp all packs under tip mods/ (multi-pack channel).
          python3 scripts/emit-mods-stamp.py "$(dirname "$pack_tip")" "$(dirname "$(dirname "$pack_tip")")"
          grep -q '127.0.0.1' "$pack_tip/mod.json" && {
            echo "::error::desktop tip mod.json still has 127.0.0.1 after stamp" >&2
            exit 1
          }
          # macOS: pack must sit next to the Play binary (ModLoader tip root).
          if [[ "${{ matrix.platform }}" == macos-arm64 ]]; then
            [[ "$pack_tip" == */Contents/MacOS/mods/idleot ]] || {
              echo "::error::macOS pack not under Contents/MacOS/mods/idleot ($pack_tip)" >&2
              exit 1
            }
          fi
          echo "ENGINE_TIP=$tip" >> "$GITHUB_ENV"

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf >/dev/null

      - name: Resolve CIP Qt (for windeploy/macdeploy if re-bundle needed)
        id: cip
        shell: bash
        working-directory: _qtclient
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD:third_party/qt5-cip 2>/dev/null || true)"
          if [[ -z "$SHA" && -f third_party/SUBMODULE_PINS.txt ]]; then
            SHA="$(awk '/^qt5-cip/{print $2}' third_party/SUBMODULE_PINS.txt)"
          fi
          [[ -n "$SHA" && "$SHA" != unknown ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # package_launcher needs macdeployqt / windeployqt / Qt libs (engine tip is
      # already bundled; --engine-files does not need Qt).
      - name: Pull CIP Qt (launcher packaging)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
        run: bash tools/qt/ci-setup.sh --pull-only

      - name: Ad-hoc sign / brand macOS engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$ENGINE_TIP" -maxdepth 2 -name '*.app' -type d | head -1)"
          [[ -n "$app" ]] || { echo "::error::no .app in $ENGINE_TIP"; exit 1; }
          # Rename stock qtclient brand → IdleOT.app for Gatekeeper / tip layout.
          dest="$(dirname "$app")/IdleOT.app"
          if [[ "$app" != "$dest" ]]; then
            rm -rf "$dest"
            mv "$app" "$dest"
            app="$dest"
          fi
          xattr -cr "$app" || true
          codesign --force --deep --sign - "$app" || true
          echo "ENGINE_APP=$app" >> "$GITHUB_ENV"

      - name: Developer ID sign app bundle
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          xattr -cr "$ENGINE_APP"
          codesign --force --deep --options runtime --timestamp \
            --entitlements "$GITHUB_WORKSPACE/_qtclient/tools/publish/installer/idleot.entitlements" \
            --sign "$MACOS_SIGN_IDENTITY" "$ENGINE_APP"

      - name: Notarize engine bundle
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$ENGINE_APP" "$RUNNER_TEMP/IdleOT-engine.zip"
          xcrun notarytool submit "$RUNNER_TEMP/IdleOT-engine.zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$ENGINE_APP"

      - name: Sign client executable
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ env.ENGINE_TIP }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Store engine and runtime
        shell: bash
        working-directory: _qtclient
        env:
          SOURCE_COMMIT: ${{ env.SHA }}
          QTCLIENT_APP_NAME: IdleOT
          QTCLIENT_BUNDLE_ID: com.idleot.tibia
          QTCLIENT_STORE_META: .idleot
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          TIBIA_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          TIBIA_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          # Login paths come from mods/idleot urls (build-pack stamps loginBase from SITE_URL).
          QTCLIENT_LOGIN_PROFILE: mod
        run: |
          set -euo pipefail
          extra=(--engine-files --login-profile mod)
          [[ "${{ matrix.platform }}" == linux-x64 ]] && extra+=(--content-files)
          if [[ "${{ matrix.platform }}" == macos-arm64 ]]; then
            extra+=(--engine-app "${ENGINE_APP}")
          else
            extra+=(--engine-dir "${ENGINE_TIP}")
          fi
          bin_dir="$RUNNER_TEMP/client/bin"
          [[ -d "$bin_dir" ]] || bin_dir="$ENGINE_TIP"
          python3 tools/publish/package_desktop.py --platform "${{ matrix.platform }}" \
            --bin "$bin_dir" --out "$RUNNER_TEMP/dist" \
            --revision "${{ needs.check.outputs.revision }}" "${extra[@]}"

      - name: Package CIP launcher installer
        shell: bash
        working-directory: _qtclient
        env:
          QTCLIENT_APP_NAME: IdleOT
          QTCLIENT_BUNDLE_ID: com.idleot.launcher
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/client/bin"
          [[ -d "$bin_dir" ]] || bin_dir="$ENGINE_TIP"
          python3 tools/publish/package_launcher.py \
            --platform "${{ matrix.platform }}" \
            --bin "$bin_dir" \
            --out "$RUNNER_TEMP/dist"

      - name: Developer ID sign and notarize launcher
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app="$RUNNER_TEMP/dist/installers/macos-arm64/IdleOT.app"
          dmg="$RUNNER_TEMP/dist/installers/macos-arm64.dmg"
          zip="$RUNNER_TEMP/dist/installers/macos-arm64.zip"
          [[ -d "$app" ]] || { echo "::error::missing $app"; exit 1; }
          keychain="$RUNNER_TEMP/launcher-signing.keychain-db"
          kc_pass="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/launcher-cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/launcher-cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/launcher-cert.p12"
          xattr -cr "$app"
          codesign --force --deep --options runtime --timestamp \
            --entitlements "$GITHUB_WORKSPACE/_qtclient/tools/publish/installer/idleot.entitlements" \
            --sign "$MACOS_SIGN_IDENTITY" "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/IdleOT-launcher.zip"
          xcrun notarytool submit "$RUNNER_TEMP/IdleOT-launcher.zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          ditto -c -k --keepParent "$app" "$zip"
          stage="$RUNNER_TEMP/launcher-dmg-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/IdleOT.app"
          ln -s /Applications "$stage/Applications"
          rm -f "$dmg"
          hdiutil create -volname IdleOT -srcfolder "$stage" -ov -format UDZO "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          rm -rf "$stage" "$RUNNER_TEMP/IdleOT-launcher.zip"

      - name: Upload store
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  desktop-publish:
    name: Push ${{ needs.check.outputs.desktop_image }}
    needs: [check, desktop]
    if: always() && needs.check.outputs.desktop != 'true' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download stores
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: parts

      - name: Merge platforms
        run: |
          mkdir -p slice/.idleot/v3 slice/content slice/packs slice/installers
          for d in parts/desktop-*; do
            cp -R "$d/content/." slice/content/
            if [[ -d "$d/packs" ]]; then cp -R "$d/packs/." slice/packs/; fi
            if [[ -d "$d/.idleot/v3" ]]; then
              cp "$d"/.idleot/v3/*.json slice/.idleot/v3/
            elif [[ -d "$d/.qtclient/v3" ]]; then
              cp "$d"/.qtclient/v3/*.json slice/.idleot/v3/
            else
              echo "::error::no v3 lists under $d (.idleot or .qtclient)"
              find "$d" -maxdepth 3 -type d | head -40
              exit 1
            fi
            if [[ -d "$d/installers" ]]; then
              cp -R "$d/installers/." slice/installers/
            fi
          done
          for plat in windows-x64 macos-arm64 linux-x64; do
            if [[ "$plat" == macos-arm64 ]]; then
              [[ -f "slice/installers/${plat}.dmg" ]] || { echo "::error::missing installers/${plat}.dmg"; exit 1; }
            else
              [[ -f "slice/installers/${plat}.zip" ]] || { echo "::error::missing installers/${plat}.zip"; exit 1; }
            fi
          done
          python3 - <<'PY'
          import json, pathlib
          v3 = pathlib.Path("slice/.idleot/v3")
          names = ["content-desktop"] + [f"engine-{p}" for p in ("windows-x64", "macos-arm64", "linux-x64")]
          lists = {n: json.loads((v3 / f"{n}.json").read_text()) for n in names}
          if len({(d["revision"], d["engine"]) for d in lists.values()}) != 1:
              raise SystemExit("v3 lists disagree on revision/engine")
          for n, d in lists.items():
              missing = [k for k, f in d["files"].items()
                         if not (pathlib.Path("slice/content") / f["sha256"][:2] / f["sha256"]).is_file()]
              if missing:
                  raise SystemExit(f"{n}: {len(missing)} blobs missing, e.g. {missing[0]}")
              print(f"{n}: {len(d['files'])} files, {len(d.get('packs', []))} packs")
          PY
          printf 'FROM scratch\nCOPY . /\n' > Dockerfile.slice

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ needs.check.outputs.desktop_image }} tip (pack + qtclient alias)
        uses: docker/build-push-action@v6
        with:
          context: slice
          file: Dockerfile.slice
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ needs.check.outputs.desktop_image }}:${{ needs.check.outputs.pack_tag }}
            ${{ env.REGISTRY }}/${{ needs.check.outputs.desktop_image }}:${{ env.SHA }}
