---
# Build IdleOT packs on **public** runners (free minutes).
#
# Host API v9 — two layers so the mod overlaps qtclient Client:ci after SDK:
#   pack-mod:  SDK → IdleOT MODULE / static-ABI .a  (needs client-sdk + CIP Qt only)
#   tip-link:  QTCLIENT_PACKS=<prefix> → product tip (desktop brand.cmake / wasm link)
#
# Private idleot-client is checked out with RELEASE_TOKEN; the qtclient tree provides
# cmake/Qt/emsdk. Compile/dep cache via vendored .github/actions/cache-{restore,save}.
# Checkout **this** repo first so local actions stay on disk.
name: Build pack

on:
  workflow_call:
    inputs:
      qtclient_sha:
        type: string
        required: true
      idleot_client_sha:
        type: string
        required: true
      build_desktop:
        type: boolean
        required: false
        default: true
      build_wasm:
        type: boolean
        required: false
        default: true
    outputs:
      pack_tag:
        value: ${{ jobs.meta.outputs.pack_tag }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  QTCLIENT_REPO: qtclient/qtclient
  IDLEOT_CLIENT_REPO: ${{ github.repository_owner }}/idleot-client
  HOST_OWNER: qtclient
  QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
  # Fail-fast: kit preflight already gated; pack jobs must not hang 2h.
  QT_PULL_WAIT_SECS: '900'
  QT_PULL_INTERVAL_SECS: '30'

jobs:
  meta:
    name: Pack tag
    runs-on: ubuntu-latest
    outputs:
      pack_tag: ${{ steps.out.outputs.pack_tag }}
    steps:
      - id: out
        run: |
          echo "pack_tag=${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}" >> "$GITHUB_OUTPUT"

  # ── pack-mod (desktop): SDK → MODULE only ─────────────────────────────
  pack-mod-desktop:
    name: pack-mod-${{ matrix.plat }}
    needs: [meta]
    if: inputs.build_desktop
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            kit: linux-x64
            triplet: x64-linux-static
            os_slug: linux
            optional: false
          - plat: macos-arm64
            runner: macos-15
            kit: macos-arm64
            triplet: arm64-osx-static
            os_slug: macos
            optional: true
          - plat: windows-x64
            runner: windows-2022
            kit: windows-x64
            triplet: x64-windows-static-md
            os_slug: windows
            # Optional: Git Bash tar/path flakes must not block wasm/linux tip flip.
            optional: true
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout release (cache actions + scripts)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            scripts
          sparse-checkout-cone-mode: true

      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: idleot-client
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      - name: Try restore pack-mod from GHCR
        id: packmod
        shell: bash
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash scripts/pull-pack-mod.sh \
            "ghcr.io/${{ github.repository_owner }}/pack-mod-idleot-${{ matrix.plat }}:${{ needs.meta.outputs.pack_tag }}" \
            "$RUNNER_TEMP/pack-install/desktop"

      - name: MSVC environment
        if: runner.os == 'Windows' && steps.packmod.outputs.pack_mod_hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve CIP Qt SHA
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        id: cip
        shell: bash
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull client-sdk (linux ORAS; readiness gate on all plats)
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        shell: bash
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash _qtclient/scripts/ci/pull-client-sdk.sh \
            "ghcr.io/${HOST_OWNER}/client-sdk:${{ inputs.qtclient_sha }}" \
            "$RUNNER_TEMP/client-sdk"

      - name: Restore Qt kit Actions blob
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        id: qtkit
        uses: actions/cache/restore@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-${{ matrix.kit }}
          restore-keys: |
            qt-kit-${{ steps.cip.outputs.sha }}-${{ matrix.kit }}
            qt-kit-${{ matrix.kit }}-

      - name: Unpack Qt kit from Actions cache
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        shell: bash
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh unpack "${{ steps.cip.outputs.sha }}" "${{ matrix.kit }}" "$QT_ROOT" || true

      - name: Restore vcpkg + ccache
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt)
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: ${{ env.QT_PULL_WAIT_SECS }}
          QT_PULL_INTERVAL_SECS: ${{ env.QT_PULL_INTERVAL_SECS }}
        run: bash tools/qt/ci-setup.sh --pull-only --with-vcpkg --with-deps

      - name: Save Qt kit Actions blob
        if: steps.packmod.outputs.pack_mod_hit != 'true' && steps.qtkit.outputs.cache-hit != 'true'
        shell: bash
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh pack "${{ steps.cip.outputs.sha }}" "${{ matrix.kit }}" "$QT_ROOT"

      - name: Persist Qt kit cache
        if: steps.packmod.outputs.pack_mod_hit != 'true' && steps.qtkit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-${{ matrix.kit }}

      - name: Build IdleOT pack MODULE (SDK only)
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/tools/zstd:$PATH"
          fi
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          sdk="$RUNNER_TEMP/qtclient-sdk/desktop"
          # Prefer published linux ORAS SDK; macOS/Windows need a local sdk.sh
          # against the platform kit (ORAS SDK is linux-oriented).
          if [[ "$RUNNER_OS" == Linux && -f "$RUNNER_TEMP/client-sdk/lib/cmake/QtClientSdk/QtClientSdkConfig.cmake" ]]; then
            sdk="$RUNNER_TEMP/client-sdk"
          else
            QTCLIENT_SDK_DIR="$sdk" bash scripts/lifecycle/build/sdk.sh
          fi
          prefix="$RUNNER_TEMP/pack-install/desktop"
          bash scripts/ci/check-pack-sdk-build.sh --pack "$GITHUB_WORKSPACE/idleot-client" \
            --sdk "$sdk" --prefix "$prefix" --build-dir "$RUNNER_TEMP/pack-build/desktop"
          ls "$prefix/mods/idleot/native/"mod.* >/dev/null 2>&1 || {
            echo "::error::pack MODULE missing: $prefix/mods/idleot/native/mod.*" >&2
            exit 1
          }
          ccache -s || true

      - name: Save vcpkg + ccache
        if: always() && steps.packmod.outputs.pack_mod_hit != 'true'
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack-mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-mod-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack-install/desktop
          retention-days: 2
          include-hidden-files: true

      - name: Login GHCR (oras) for idleot push
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack-mod to GHCR
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tar -czf pack-mod.tgz -C pack-install/desktop .
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-mod-idleot-${{ matrix.plat }}:${tag}" \
            "pack-mod.tgz:application/vnd.oci.image.layer.v1.tar+gzip"

  # ── tip-link (desktop): pack MODULE → product tip ─────────────────────
  tip-link-desktop:
    name: tip-link-${{ matrix.plat }}
    needs: [meta, pack-mod-desktop]
    if: inputs.build_desktop && always() && (needs.pack-mod-desktop.result == 'success' || needs.pack-mod-desktop.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            kit: linux-x64
            triplet: x64-linux-static
            os_slug: linux
            optional: false
          - plat: macos-arm64
            runner: macos-15
            kit: macos-arm64
            triplet: arm64-osx-static
            os_slug: macos
            optional: true
          - plat: windows-x64
            runner: windows-2022
            kit: windows-x64
            triplet: x64-windows-static-md
            os_slug: windows
            # Optional: Git Bash tar/path flakes must not block wasm/linux tip flip.
            optional: true
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout release (cache actions + scripts)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            scripts
          sparse-checkout-cone-mode: true

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      - name: Download pack-mod
        uses: actions/download-artifact@v4
        with:
          name: pack-mod-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack-install/desktop

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve CIP Qt SHA
        id: cip
        shell: bash
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore Qt kit Actions blob
        id: qtkit
        uses: actions/cache/restore@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-${{ matrix.kit }}
          restore-keys: |
            qt-kit-${{ steps.cip.outputs.sha }}-${{ matrix.kit }}

      - name: Unpack Qt kit from Actions cache
        shell: bash
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh unpack "${{ steps.cip.outputs.sha }}" "${{ matrix.kit }}" "$QT_ROOT" || true

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: ${{ env.QT_PULL_WAIT_SECS }}
          QT_PULL_INTERVAL_SECS: ${{ env.QT_PULL_INTERVAL_SECS }}
        run: bash tools/qt/ci-setup.sh --pull-only --with-vcpkg --with-deps

      - name: Save Qt kit Actions blob
        if: steps.qtkit.outputs.cache-hit != 'true'
        shell: bash
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh pack "${{ steps.cip.outputs.sha }}" "${{ matrix.kit }}" "$QT_ROOT"

      - name: Persist Qt kit cache
        if: steps.qtkit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-${{ matrix.kit }}

      - name: Build qtclient tip with IdleOT pack (QTCLIENT_PACKS)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
          STOCK_HOST: '0'
          QTCLIENT_ENABLE_MODS: 'ON'
          TIBIA_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          TIBIA_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          QTCLIENT_PAYMENTS_URL: ${{ vars.IDLEOT_PAYMENTS_URL || 'https://payments.idleot.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/tools/zstd:$PATH"
          fi
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          export TIBIA_SITE_URL IDLEOT_SITE_URL TIBIA_ASSET_BASE IDLEOT_ASSET_BASE QTCLIENT_PAYMENTS_URL
          prefix="$RUNNER_TEMP/pack-install/desktop"
          ls "$prefix/mods/idleot/native/"mod.* >/dev/null 2>&1 || {
            echo "::error::pack-mod artifact missing native/mod.* under $prefix" >&2
            find "$prefix" -maxdepth 4 2>/dev/null | head -80 || true
            exit 1
          }
          QTCLIENT_PACKS="$prefix" bash scripts/lifecycle/build/desktop.sh
          bash scripts/lifecycle/build/desktop.sh --launcher
          bin="$(bash scripts/lifecycle/lib/find-client-bin.sh . 2>/dev/null || true)"
          [[ -n "$bin" && -e "$bin" ]] || {
            echo "::error::tip client binary missing after qtclient desktop build" >&2
            exit 1
          }
          tip="$(dirname "$bin")"
          case "$tip" in
            *.app/Contents/MacOS) tip="$(cd "$tip/../../.." && pwd)" ;;
          esac
          pack="$tip/mods/idleot"
          if [[ ! -f "$pack/mod.json" ]]; then
            pack="$(find "$tip" -path '*/mods/idleot/mod.json' 2>/dev/null | head -1 | xargs dirname || true)"
          fi
          [[ -n "${pack:-}" && -f "$pack/mod.json" ]] || {
            echo "::error::tip mods/idleot/mod.json missing (QTCLIENT_PACKS stage)" >&2
            find "$tip" -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          bash scripts/lifecycle/lib/check-tip-pack-presence.sh \
            --tip "$(dirname "$(dirname "$pack")")" --id idleot --native
          python3 "$GITHUB_WORKSPACE/scripts/stamp-mod-urls.py" "$pack/mod.json" \
            --site "$TIBIA_SITE_URL" --asset "$TIBIA_ASSET_BASE" --payments "$QTCLIENT_PAYMENTS_URL"
          if grep -q '127.0.0.1' "$pack/mod.json"; then
            echo "::error::tip pack mod.json still has 127.0.0.1 after stamp" >&2
            cat "$pack/mod.json" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pack"
          cp -a "$pack" "$RUNNER_TEMP/pack/idleot"
          PACKAGE_OUT="$RUNNER_TEMP/pack/linked-tip" \
            QTCLIENT_PLATFORM="${{ matrix.plat }}" \
            PLATFORM="${{ matrix.plat }}" \
            bash scripts/lifecycle/package/desktop.sh
          if [[ ! -e "$RUNNER_TEMP/pack/linked-tip/bin/launcher" \
             && ! -e "$RUNNER_TEMP/pack/linked-tip/bin/launcher.exe" \
             && ! -d "$RUNNER_TEMP/pack/linked-tip/bin/launcher.app" ]]; then
            echo "::error::tip missing bin/launcher after package/desktop.sh" >&2
            ls -la "$RUNNER_TEMP/pack/linked-tip/bin" 2>/dev/null || true
            exit 1
          fi
          ccache -s || true

      - name: Upload desktop crash symbols
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          TOKEN: ${{ secrets.QTCAAC_SYMBOL_UPLOAD_TOKEN }}
          SITE: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          DUMP_SYMS_VERSION: v2.3.9
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::notice::QTCAAC_SYMBOL_UPLOAD_TOKEN not set — skip desktop symbols"
            exit 0
          fi
          case "${{ matrix.plat }}" in
            macos-arm64) asset=dump_syms-aarch64-apple-darwin.tar.xz
              sha=4945b7e5de0d7ad403822635f0fb912b69990fc412741ff2b7b512e168c40a32 ;;
            linux-x64) asset=dump_syms-x86_64-unknown-linux-gnu.tar.xz
              sha=0fc852a86b00337407d9d423cc388a24c3b489ccaaedcf92623cad57af5ca8ad ;;
            windows-x64) asset=dump_syms-x86_64-pc-windows-msvc.zip
              sha=bdf48486220708808a3e00aec78856ee1cce096189d47a1e2cb1c635f93bacc7 ;;
            *) echo "::warning::no dump_syms for ${{ matrix.plat }}"; exit 0 ;;
          esac
          dir="$RUNNER_TEMP/dump_syms"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/mozilla/dump_syms/releases/download/$DUMP_SYMS_VERSION/$asset"
          python3 -c 'import hashlib,sys; got=hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest(); sys.exit(0 if got==sys.argv[2] else "dump_syms sha256 mismatch")' \
            "$dir/$asset" "$sha"
          case "$asset" in
            *.zip) (cd "$dir" && unzip -q -o "$asset") ;;
            *) tar -xJf "$dir/$asset" -C "$dir" ;;
          esac
          bin="$(find "$dir" -type f \( -name dump_syms -o -name dump_syms.exe \) | head -1)"
          chmod +x "$bin"
          pdbs=()
          while IFS= read -r pdb; do pdbs+=("$pdb"); done \
            < <(find _qtclient/build -path '*/bin/*' -name '*.pdb' 2>/dev/null)
          python3 scripts/upload-desktop-symbols.py "$bin" "$RUNNER_TEMP/pack/linked-tip" \
            ${pdbs[@]+"${pdbs[@]}"}

      - name: Save vcpkg + ccache
        if: always()
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack artifact (FS chrome)
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/idleot
          retention-days: 2
          include-hidden-files: true

      - name: Upload tip (engine + mods incl. native/mod.*)
        uses: actions/upload-artifact@v4
        with:
          name: pack-linked-tip-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/linked-tip
          retention-days: 2
          include-hidden-files: true

  # ── pack-mod (wasm): SDK → static-ABI .a only ─────────────────────────
  pack-mod-wasm:
    name: pack-mod-wasm
    needs: [meta]
    if: inputs.build_wasm
    runs-on: ubuntu-24.04
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout release (cache actions + scripts)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            scripts
          sparse-checkout-cone-mode: true

      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: idleot-client
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      - name: Try restore pack-mod from GHCR
        id: packmod
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash scripts/pull-pack-mod.sh \
            "ghcr.io/${{ github.repository_owner }}/pack-mod-idleot-wasm:${{ needs.meta.outputs.pack_tag }}" \
            "$RUNNER_TEMP/pack-install/wasm"

      - name: Resolve CIP Qt SHA
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        id: cip
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore Qt kit Actions blob
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        id: qtkit
        uses: actions/cache/restore@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-wasm_multithread
          restore-keys: |
            qt-kit-${{ steps.cip.outputs.sha }}-wasm_multithread

      - name: Unpack Qt kit from Actions cache
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh unpack "${{ steps.cip.outputs.sha }}" wasm_multithread "$QT_ROOT" || true

      - name: Restore vcpkg + ccache
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt wasm)
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: ${{ env.QT_PULL_WAIT_SECS }}
          QT_PULL_INTERVAL_SECS: ${{ env.QT_PULL_INTERVAL_SECS }}
        run: bash tools/qt/ci-setup.sh --wasm --pull-only --with-vcpkg --with-deps

      - name: Save Qt kit Actions blob
        if: steps.packmod.outputs.pack_mod_hit != 'true' && steps.qtkit.outputs.cache-hit != 'true'
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh pack "${{ steps.cip.outputs.sha }}" wasm_multithread "$QT_ROOT"

      - name: Persist Qt kit cache
        if: steps.packmod.outputs.pack_mod_hit != 'true' && steps.qtkit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-wasm_multithread

      - name: Build IdleOT wasm pack (static-ABI against SDK)
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: wasm32-emscripten
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          sdk="$RUNNER_TEMP/qtclient-sdk/wasm"
          # Prefer published wasm SDK ORAS when present (one-shot; no long wait).
          if bash "$GITHUB_WORKSPACE/scripts/try-pull-client-sdk.sh" \
              "ghcr.io/${HOST_OWNER}/client-sdk-wasm:${{ inputs.qtclient_sha }}" \
              "$RUNNER_TEMP/client-sdk-wasm"; then
            sdk="$RUNNER_TEMP/client-sdk-wasm"
            echo "[pack-mod-wasm] using client-sdk-wasm ORAS"
          else
            echo "[pack-mod-wasm] client-sdk-wasm miss — local sdk.sh --wasm"
            QTCLIENT_SDK_DIR="$sdk" bash scripts/lifecycle/build/sdk.sh --wasm
          fi
          prefix="$RUNNER_TEMP/pack-install/wasm"
          bash scripts/ci/check-pack-sdk-build.sh --pack "$GITHUB_WORKSPACE/idleot-client" --wasm \
            --sdk "$sdk" --prefix "$prefix" --build-dir "$RUNNER_TEMP/pack-build/wasm"
          test -f "$prefix/lib/cmake/QtClientPack_idleot/QtClientPack_idleotConfig.cmake" || {
            echo "::error::pack static-ABI export missing under $prefix/lib/cmake" >&2
            exit 1
          }
          ccache -s || true

      - name: Save vcpkg + ccache
        if: always() && steps.packmod.outputs.pack_mod_hit != 'true'
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack-mod-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-mod-idleot-wasm
          path: ${{ runner.temp }}/pack-install/wasm
          retention-days: 2
          include-hidden-files: true

      - name: Login GHCR (oras) for idleot push
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack-mod-wasm to GHCR
        if: steps.packmod.outputs.pack_mod_hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tar -czf pack-mod.tgz -C pack-install/wasm .
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-mod-idleot-wasm:${tag}" \
            "pack-mod.tgz:application/vnd.oci.image.layer.v1.tar+gzip"

  # ── tip-link (wasm): static-ABI pack → linked tibia.wasm ──────────────
  tip-link-wasm:
    name: tip-link-wasm
    needs: [meta, pack-mod-wasm]
    if: inputs.build_wasm && needs.pack-mod-wasm.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout release (cache actions + scripts)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            scripts
          sparse-checkout-cone-mode: true

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      - name: Download pack-mod-wasm
        uses: actions/download-artifact@v4
        with:
          name: pack-mod-idleot-wasm
          path: ${{ runner.temp }}/pack-install/wasm

      - name: Resolve CIP Qt SHA
        id: cip
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore Qt kit Actions blob
        id: qtkit
        uses: actions/cache/restore@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-wasm_multithread
          restore-keys: |
            qt-kit-${{ steps.cip.outputs.sha }}-wasm_multithread

      - name: Unpack Qt kit from Actions cache
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh unpack "${{ steps.cip.outputs.sha }}" wasm_multithread "$QT_ROOT" || true

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt wasm)
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: ${{ env.QT_PULL_WAIT_SECS }}
          QT_PULL_INTERVAL_SECS: ${{ env.QT_PULL_INTERVAL_SECS }}
        run: bash tools/qt/ci-setup.sh --wasm --pull-only --with-vcpkg --with-deps

      - name: Save Qt kit Actions blob
        if: steps.qtkit.outputs.cache-hit != 'true'
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          QTCLIENT_ROOT: ${{ github.workspace }}/_qtclient
        run: bash scripts/cache-qt-kit.sh pack "${{ steps.cip.outputs.sha }}" wasm_multithread "$QT_ROOT"

      - name: Persist Qt kit cache
        if: steps.qtkit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/qt-kit
          key: qt-kit-${{ steps.cip.outputs.sha }}-wasm_multithread

      - name: Link IdleOT pack into wasm tip
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: wasm32-emscripten
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
          STOCK_HOST: '0'
          QTCLIENT_ENABLE_MODS: 'ON'
          TIBIA_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          TIBIA_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          QTCLIENT_PAYMENTS_URL: ${{ vars.IDLEOT_PAYMENTS_URL || 'https://payments.idleot.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          export TIBIA_SITE_URL IDLEOT_SITE_URL TIBIA_ASSET_BASE IDLEOT_ASSET_BASE QTCLIENT_PAYMENTS_URL
          prefix="$RUNNER_TEMP/pack-install/wasm"
          test -f "$prefix/lib/cmake/QtClientPack_idleot/QtClientPack_idleotConfig.cmake" || {
            echo "::error::pack-mod-wasm artifact missing QtClientPack_idleot under $prefix" >&2
            find "$prefix" -maxdepth 4 2>/dev/null | head -80 || true
            exit 1
          }
          QTCLIENT_PACKS="$prefix" bash scripts/lifecycle/build/wasm.sh
          bin=""
          for cand in build/qtclient-wasm/bin build/qtclient-wasm; do
            if [[ -f "$cand/tibia.wasm" && -f "$cand/tibia.js" ]]; then
              bin="$cand"
              break
            fi
          done
          [[ -n "$bin" ]] || {
            echo "::error::tip tibia.wasm missing after qtclient wasm build" >&2
            find build/qtclient-wasm -name 'tibia.*' 2>/dev/null | head -40 || true
            exit 1
          }
          pack="$bin/mods/idleot"
          [[ -f "$pack/mod.json" ]] || {
            echo "::error::tip mods/idleot/mod.json missing (QTCLIENT_PACKS stage)" >&2
            find "$bin" -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          if [[ -d "$pack/native" ]] || find "$pack" -name 'mod.wasm' 2>/dev/null | grep -q .; then
            echo "::error::native/ must not ship on the wasm tip (static-ABI pack)" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/linked-tip"
          bash scripts/lifecycle/package/pack-qtclient-wasm.sh "$bin" "$RUNNER_TEMP/linked-tip"
          tip_pack="$(find "$RUNNER_TEMP/linked-tip" -path '*/mods/idleot/mod.json' | head -1 | xargs dirname)"
          [[ -n "$tip_pack" && -f "$tip_pack/mod.json" ]] || tip_pack="$RUNNER_TEMP/linked-tip/mods/idleot"
          python3 "$GITHUB_WORKSPACE/scripts/stamp-mod-urls.py" "$tip_pack/mod.json" \
            --site "$TIBIA_SITE_URL" --asset "$TIBIA_ASSET_BASE" --payments "$QTCLIENT_PAYMENTS_URL"
          if grep -q '127.0.0.1' "$tip_pack/mod.json"; then
            echo "::error::wasm tip mod.json still has 127.0.0.1 after stamp" >&2
            cat "$tip_pack/mod.json" >&2
            exit 1
          fi
          python3 - "$tip_pack" <<'PY'
          import hashlib, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          h = hashlib.sha256()
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if rel in {".pack.stamp", ".files.manifest"}:
                  continue
              h.update(rel.encode()); h.update(b"\0")
              h.update(path.read_bytes()); h.update(b"\0")
          (root / ".pack.stamp").write_text(h.hexdigest() + "\n")
          print("[pack] .pack.stamp", h.hexdigest()[:16])
          PY
          ccache -s || true

      - name: Upload tibia.wasm symbol map
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.QTCAAC_SYMBOL_UPLOAD_TOKEN }}
          SITE: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::notice::QTCAAC_SYMBOL_UPLOAD_TOKEN not set — skip symbol upload"
            exit 0
          fi
          sym="$(find _qtclient/build/qtclient-wasm -name tibia.js.symbols | head -1)"
          tip="$(find "$RUNNER_TEMP/linked-tip/client" -mindepth 2 -maxdepth 2 -type d -name wasm | head -1)"
          [[ -n "$sym" && -n "$tip" ]] || { echo "::warning::no tibia.js.symbols or tip dir — skip"; exit 0; }
          rev="$(basename "$(dirname "$tip")")"
          code="$(curl -sS --retry 3 --max-time 300 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -F "revision=$rev" -F "file=@$sym;filename=tibia.wasm.symbols" \
            "$SITE/api/telemetry/symbols")"
          echo "[symbols] tibia.wasm revision $rev → HTTP $code"
          [[ "$code" == 201 ]] || echo "::warning::symbol upload returned HTTP $code"

      - name: Save vcpkg + ccache
        if: always()
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ inputs.qtclient_sha }}
          unique_ccache: ${{ inputs.qtclient_sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-wasm
          path: ${{ runner.temp }}/linked-tip
          retention-days: 2
          include-hidden-files: true
