---
# Build qtclient+IdleOT linked tips on **public** runners (free minutes).
# Pack C++ STATIC-links into qtclient (QTCLIENT_LINKED_PACK); FS chrome stages under
# mods/idleot/. Also stages pack-archive-idleot-* (.a + FS) for QTCLIENT_LINKED_PACK_LIBS.
# No native/SIDE_MODULE. Private idleot-client is checked out with RELEASE_TOKEN;
# qtclient tree provides cmake/Qt/emsdk.
#
# Compile/dep cache: same qtclient contract via vendored
# .github/actions/cache-{restore,save} (workspace/.cache/{vcpkg,ccache} + qtclient GHCR
# vcpkg tip). Checkout **this** repo first so local actions stay on disk — packing
# idleot-client into $GITHUB_WORKSPACE would wipe .github/actions.
name: Build pack

on:
  workflow_call:
    inputs:
      qtclient_sha:
        type: string
        required: true
      idleot_client_sha:
        type: string
        required: true
      build_desktop:
        type: boolean
        required: false
        default: true
      build_wasm:
        type: boolean
        required: false
        default: true
    outputs:
      pack_tag:
        value: ${{ jobs.meta.outputs.pack_tag }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  QTCLIENT_REPO: qtclient/qtclient
  IDLEOT_CLIENT_REPO: ${{ github.repository_owner }}/idleot-client
  HOST_OWNER: qtclient
  QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}

jobs:
  meta:
    name: Pack tag
    runs-on: ubuntu-latest
    outputs:
      pack_tag: ${{ steps.out.outputs.pack_tag }}
    steps:
      - id: out
        run: |
          echo "pack_tag=${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}" >> "$GITHUB_OUTPUT"

  pack-desktop:
    name: pack-${{ matrix.plat }}
    needs: [meta]
    if: inputs.build_desktop
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            kit: linux-x64
            triplet: x64-linux-static
            os_slug: linux
          - plat: macos-arm64
            runner: macos-15
            kit: macos-arm64
            triplet: arm64-osx-static
            os_slug: macos
          - plat: windows-x64
            runner: windows-2022
            kit: windows-x64
            triplet: x64-windows-static-md
            os_slug: windows
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      # Keep release .github/actions on disk for cache-restore/save.
      - name: Checkout release (cache actions)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: idleot-client
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      # qtclient-* packages are public. Do NOT oras-login with idleot GITHUB_TOKEN
      # first — installation tokens 403 cross-org pulls even when the package is public.
      - name: Wait + pull qtclient client-sdk
        shell: bash
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash _qtclient/scripts/ci/pull-client-sdk.sh \
            "ghcr.io/${HOST_OWNER}/client-sdk:${{ inputs.qtclient_sha }}" \
            "$RUNNER_TEMP/client-sdk"

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve CIP Qt SHA
        id: cip
        shell: bash
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ github.sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
        run: bash tools/qt/ci-setup.sh --pull-only --with-vcpkg --with-deps

      - name: Build qtclient linked tip (STATIC IdleOT)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
          STOCK_HOST: '0'
          QTCLIENT_ENABLE_MODS: 'ON'
          QTCLIENT_LINKED_PACK: ${{ github.workspace }}/idleot-client/client
          TIBIA_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          TIBIA_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          QTCLIENT_PAYMENTS_URL: ${{ vars.IDLEOT_PAYMENTS_URL || 'https://payments.idleot.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/tools/zstd:$PATH"
          fi
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          export TIBIA_SITE_URL IDLEOT_SITE_URL TIBIA_ASSET_BASE IDLEOT_ASSET_BASE QTCLIENT_PAYMENTS_URL
          bash scripts/lifecycle/build/desktop.sh
          bin="$(bash scripts/lifecycle/lib/find-client-bin.sh . 2>/dev/null || true)"
          [[ -n "$bin" && -e "$bin" ]] || {
            echo "::error::linked tip client binary missing after qtclient desktop build" >&2
            exit 1
          }
          tip="$(dirname "$bin")"
          pack="$tip/mods/idleot"
          [[ -f "$pack/mod.json" ]] || {
            echo "::error::linked tip mods/idleot/mod.json missing" >&2
            find "$tip" -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          if [[ -d "$pack/native" ]]; then
            echo "::error::native/ must not ship on linked tip" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pack"
          # Artifact keeps FS chrome for assemble brand/stamp; tip binary tree is
          # published via qtclient desktop package below when present.
          cp -a "$pack" "$RUNNER_TEMP/pack/idleot"
          # Also stage tip root marker so assemble can prefer linked qtclient tip.
          mkdir -p "$RUNNER_TEMP/pack/linked-tip-meta"
          echo "$tip" >"$RUNNER_TEMP/pack/linked-tip-meta/tip-dir.txt"
          python3 -c "import json,sys;p,s,a,pay=sys.argv[1:5];d=json.load(open(p));d.pop('native',None);u=d.setdefault('urls',{});u['loginBase']=s.rstrip('/');u['assetBase']=a.rstrip('/');u['paymentsBase']=pay.rstrip('/');json.dump(d,open(p,'w'),indent=2);open(p,'a').write('\\n');print('[pack] stamped',u['loginBase'],u['assetBase'])" \
            "$RUNNER_TEMP/pack/idleot/mod.json" "$TIBIA_SITE_URL" "$TIBIA_ASSET_BASE" "$QTCLIENT_PAYMENTS_URL"
          if grep -q '127.0.0.1' "$RUNNER_TEMP/pack/idleot/mod.json"; then
            echo "::error::pack mod.json still has 127.0.0.1 after stamp" >&2
            cat "$RUNNER_TEMP/pack/idleot/mod.json" >&2
            exit 1
          fi
          # Package qtclient desktop tip (engine + mods) for assemble.
          PACKAGE_OUT="$RUNNER_TEMP/pack/linked-tip" \
            QTCLIENT_PLATFORM="${{ matrix.plat }}" \
            PLATFORM="${{ matrix.plat }}" \
            bash scripts/lifecycle/package/desktop.sh
          # Phase 3: pack archive (.a + FS) for QTCLIENT_LINKED_PACK_LIBS tip link.
          build_dir=""
          while IFS= read -r libdir; do
            [[ -z "$libdir" ]] && continue
            build_dir="$(cd "$libdir/../../.." && pwd)"
            break
          done < <(find build -type d -path '*/mods/idleot/lib' 2>/dev/null | head -5)
          if [[ -n "$build_dir" ]]; then
            bash scripts/lifecycle/package/archive-mod.sh \
              --id idleot --build-dir "$build_dir" \
              --out "$RUNNER_TEMP/pack/archive-idleot" \
              || echo "::warning::archive-mod.sh failed (non-fatal this run)" >&2
          else
            echo "::warning::IdleOT STATIC .a not found under build/*/mods/idleot/lib" >&2
          fi

      - name: Save vcpkg + ccache
        if: always()
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ github.sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/idleot
          retention-days: 2
          include-hidden-files: true

      - name: Upload pack archive artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pack-archive-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/archive-idleot
          retention-days: 2
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Pack ccache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-pack-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-pack-${{ matrix.os_slug }}-${{ github.sha }}
          path: ccache-pack-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Login GHCR (oras) for idleot push
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack to GHCR (cache for retries)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tar -czf pack.tgz -C pack idleot
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-idleot-${{ matrix.plat }}:${tag}" \
            "pack.tgz:application/vnd.oci.image.layer.v1.tar+gzip"

  pack-wasm:
    name: pack-wasm
    needs: [meta]
    if: inputs.build_wasm
    runs-on: ubuntu-24.04
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout release (cache actions)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: idleot-client
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      # qtclient-* packages are public — pull anonymously (see pack-desktop note).
      - name: Wait + pull qtclient client-sdk
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash _qtclient/scripts/ci/pull-client-sdk.sh \
            "ghcr.io/${HOST_OWNER}/client-sdk:${{ inputs.qtclient_sha }}" \
            "$RUNNER_TEMP/client-sdk"

      - name: Resolve CIP Qt SHA
        id: cip
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ github.sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt wasm)
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
        run: bash tools/qt/ci-setup.sh --wasm --pull-only --with-vcpkg --with-deps

      - name: Build qtclient linked tip (STATIC IdleOT)
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: wasm32-emscripten
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
          STOCK_HOST: '0'
          QTCLIENT_ENABLE_MODS: 'ON'
          QTCLIENT_LINKED_PACK: ${{ github.workspace }}/idleot-client/client
          TIBIA_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          TIBIA_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          QTCLIENT_PAYMENTS_URL: ${{ vars.IDLEOT_PAYMENTS_URL || 'https://payments.idleot.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          export TIBIA_SITE_URL IDLEOT_SITE_URL TIBIA_ASSET_BASE IDLEOT_ASSET_BASE QTCLIENT_PAYMENTS_URL
          bash scripts/lifecycle/build/wasm.sh
          bin=""
          for cand in build/tibia-wasm/bin build/tibia-wasm; do
            if [[ -f "$cand/tibia.wasm" && -f "$cand/tibia.js" ]]; then
              bin="$cand"
              break
            fi
          done
          [[ -n "$bin" ]] || {
            echo "::error::linked tip tibia.wasm missing after qtclient wasm build" >&2
            find build/tibia-wasm -name 'tibia.*' 2>/dev/null | head -40 || true
            exit 1
          }
          pack="$bin/mods/idleot"
          [[ -f "$pack/mod.json" ]] || {
            echo "::error::linked tip mods/idleot/mod.json missing (QTCLIENT_LINKED_PACK stage)" >&2
            find "$bin" -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          if [[ -d "$pack/native" ]] || find "$pack" -name 'mod.wasm' 2>/dev/null | grep -q .; then
            echo "::error::native/mod.wasm must not ship on linked tip" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/linked-tip"
          bash scripts/lifecycle/package/pack-tibia-wasm.sh "$bin" "$RUNNER_TEMP/linked-tip"
          tip_pack="$(find "$RUNNER_TEMP/linked-tip" -path '*/mods/idleot/mod.json' | head -1 | xargs dirname)"
          [[ -n "$tip_pack" && -f "$tip_pack/mod.json" ]] || tip_pack="$RUNNER_TEMP/linked-tip/mods/idleot"
          python3 -c "import json,sys;p,s,a,pay=sys.argv[1:5];d=json.load(open(p));d.pop('native',None);u=d.setdefault('urls',{});u['loginBase']=s.rstrip('/');u['assetBase']=a.rstrip('/');u['paymentsBase']=pay.rstrip('/');json.dump(d,open(p,'w'),indent=2);open(p,'a').write('\\n');print('[pack] stamped',u['loginBase'],u['assetBase'])" \
            "$tip_pack/mod.json" "$TIBIA_SITE_URL" "$TIBIA_ASSET_BASE" "$QTCLIENT_PAYMENTS_URL"
          if grep -q '127.0.0.1' "$tip_pack/mod.json"; then
            echo "::error::wasm tip mod.json still has 127.0.0.1 after stamp" >&2
            cat "$tip_pack/mod.json" >&2
            exit 1
          fi

      - name: Save vcpkg + ccache
        if: always()
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ github.sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-wasm
          path: ${{ runner.temp }}/linked-tip
          retention-days: 2
          include-hidden-files: true

      - name: Pack ccache
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-pack-wasm-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-pack-wasm-${{ github.sha }}
          path: ccache-pack-wasm-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Login GHCR (oras) for idleot push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack-wasm to GHCR
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Build step stages the qtclient tip under linked-tip/ (artifact path).
          # ORAS cache matches desktop: pack/idleot only.
          tip_pack="$(find linked-tip -path '*/mods/idleot/mod.json' 2>/dev/null | head -1 | xargs -r dirname || true)"
          [[ -n "${tip_pack:-}" && -f "$tip_pack/mod.json" ]] || tip_pack="linked-tip/mods/idleot"
          [[ -f "$tip_pack/mod.json" ]] || {
            echo "::error::no stamped mods/idleot under linked-tip for ORAS push" >&2
            find linked-tip -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          mkdir -p pack
          rm -rf pack/idleot
          cp -a "$tip_pack" pack/idleot
          tar -czf pack.tgz -C pack idleot
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-idleot-wasm:${tag}" \
            "pack.tgz:application/vnd.oci.image.layer.v1.tar+gzip"
