---
# Build qtclient+IdleOT linked tips on **public** runners (free minutes).
# Pack C++ STATIC-links into qtclient (QTCLIENT_LINKED_PACK); FS chrome stages under
# mods/idleot/. Also stages pack-archive-idleot-* (.a + FS) for QTCLIENT_LINKED_PACK_LIBS.
# No native/SIDE_MODULE. Private idleot-client is checked out with RELEASE_TOKEN;
# qtclient tree provides cmake/Qt/emsdk.
#
# Compile/dep cache: same qtclient contract via vendored
# .github/actions/cache-{restore,save} (workspace/.cache/{vcpkg,ccache} + qtclient GHCR
# vcpkg tip). Checkout **this** repo first so local actions stay on disk — packing
# idleot-client into $GITHUB_WORKSPACE would wipe .github/actions.
name: Build pack

on:
  workflow_call:
    inputs:
      qtclient_sha:
        type: string
        required: true
      idleot_client_sha:
        type: string
        required: true
      build_desktop:
        type: boolean
        required: false
        default: true
      build_wasm:
        type: boolean
        required: false
        default: true
    outputs:
      pack_tag:
        value: ${{ jobs.meta.outputs.pack_tag }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  QTCLIENT_REPO: qtclient/qtclient
  IDLEOT_CLIENT_REPO: ${{ github.repository_owner }}/idleot-client
  HOST_OWNER: qtclient
  QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}

jobs:
  meta:
    name: Pack tag
    runs-on: ubuntu-latest
    outputs:
      pack_tag: ${{ steps.out.outputs.pack_tag }}
    steps:
      - id: out
        run: |
          echo "pack_tag=${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}" >> "$GITHUB_OUTPUT"

  pack-desktop:
    name: pack-${{ matrix.plat }}
    needs: [meta]
    if: inputs.build_desktop
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            kit: linux-x64
            triplet: x64-linux-static
            os_slug: linux
          - plat: macos-arm64
            runner: macos-15
            kit: macos-arm64
            triplet: arm64-osx-static
            os_slug: macos
          - plat: windows-x64
            runner: windows-2022
            kit: windows-x64
            triplet: x64-windows-static-md
            os_slug: windows
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      # Keep release .github/actions on disk for cache-restore/save.
      - name: Checkout release (cache actions + stamp script)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            scripts/stamp-mod-urls.py
            scripts/upload-desktop-symbols.py
          sparse-checkout-cone-mode: false

      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: idleot-client
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      # qtclient-* packages are public. Do NOT oras-login with idleot GITHUB_TOKEN
      # first — installation tokens 403 cross-org pulls even when the package is public.
      - name: Wait + pull qtclient client-sdk
        shell: bash
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash _qtclient/scripts/ci/pull-client-sdk.sh \
            "ghcr.io/${HOST_OWNER}/client-sdk:${{ inputs.qtclient_sha }}" \
            "$RUNNER_TEMP/client-sdk"

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve CIP Qt SHA
        id: cip
        shell: bash
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
        run: bash tools/qt/ci-setup.sh --pull-only --with-vcpkg --with-deps

      - name: Build qtclient linked tip (STATIC IdleOT)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
          STOCK_HOST: '0'
          QTCLIENT_ENABLE_MODS: 'ON'
          QTCLIENT_LINKED_PACK: ${{ github.workspace }}/idleot-client/client
          TIBIA_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          TIBIA_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          QTCLIENT_PAYMENTS_URL: ${{ vars.IDLEOT_PAYMENTS_URL || 'https://payments.idleot.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/tools/zstd:$PATH"
          fi
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          export TIBIA_SITE_URL IDLEOT_SITE_URL TIBIA_ASSET_BASE IDLEOT_ASSET_BASE QTCLIENT_PAYMENTS_URL
          bash scripts/lifecycle/build/desktop.sh
          # Launcher installer needs bin/launcher next to the client in the linked tip.
          bash scripts/lifecycle/build/desktop.sh --launcher
          bin="$(bash scripts/lifecycle/lib/find-client-bin.sh . 2>/dev/null || true)"
          [[ -n "$bin" && -e "$bin" ]] || {
            echo "::error::linked tip client binary missing after qtclient desktop build" >&2
            exit 1
          }
          tip="$(dirname "$bin")"
          # find-client-bin may land inside *.app/Contents/MacOS — package wants bin/.
          case "$tip" in
            *.app/Contents/MacOS) tip="$(cd "$tip/../../.." && pwd)" ;;
          esac
          pack="$tip/mods/idleot"
          if [[ ! -f "$pack/mod.json" ]]; then
            # macOS: mods live under client.app/Contents/MacOS/mods/idleot
            pack="$(find "$tip" -path '*/mods/idleot/mod.json' 2>/dev/null | head -1 | xargs dirname || true)"
          fi
          [[ -n "${pack:-}" && -f "$pack/mod.json" ]] || {
            echo "::error::linked tip mods/idleot/mod.json missing" >&2
            find "$tip" -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          if [[ -d "$pack/native" ]]; then
            echo "::error::native/ must not ship on linked tip" >&2
            exit 1
          fi
          # Stamp tip pack URLs before packaging so linked-tip ships production bases
          # (urls.* + launchersettings.URLS.systemSurvey).
          python3 "$GITHUB_WORKSPACE/scripts/stamp-mod-urls.py" "$pack/mod.json" \
            --site "$TIBIA_SITE_URL" --asset "$TIBIA_ASSET_BASE" --payments "$QTCLIENT_PAYMENTS_URL"
          if grep -q '127.0.0.1' "$pack/mod.json"; then
            echo "::error::tip pack mod.json still has 127.0.0.1 after stamp" >&2
            cat "$pack/mod.json" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pack"
          # Artifact keeps FS chrome for assemble brand/stamp; tip binary tree is
          # published via qtclient desktop package below when present.
          cp -a "$pack" "$RUNNER_TEMP/pack/idleot"
          # Also stage tip root marker so assemble can prefer linked qtclient tip.
          mkdir -p "$RUNNER_TEMP/pack/linked-tip-meta"
          echo "$tip" >"$RUNNER_TEMP/pack/linked-tip-meta/tip-dir.txt"
          # Package qtclient desktop tip (engine + mods + launcher) for assemble.
          PACKAGE_OUT="$RUNNER_TEMP/pack/linked-tip" \
            QTCLIENT_PLATFORM="${{ matrix.plat }}" \
            PLATFORM="${{ matrix.plat }}" \
            bash scripts/lifecycle/package/desktop.sh
          # Fail early if launcher did not land in the linked tip (assemble needs it).
          if [[ ! -e "$RUNNER_TEMP/pack/linked-tip/bin/launcher" \
             && ! -e "$RUNNER_TEMP/pack/linked-tip/bin/launcher.exe" \
             && ! -d "$RUNNER_TEMP/pack/linked-tip/bin/launcher.app" ]]; then
            echo "::error::linked tip missing bin/launcher after package/desktop.sh" >&2
            ls -la "$RUNNER_TEMP/pack/linked-tip/bin" 2>/dev/null || true
            exit 1
          fi
          # Phase 3: pack archive (.a + FS) for QTCLIENT_LINKED_PACK_LIBS tip link.
          build_dir=""
          while IFS= read -r libdir; do
            [[ -z "$libdir" ]] && continue
            build_dir="$(cd "$libdir/../../.." && pwd)"
            break
          done < <(find build -type d -path '*/mods/idleot/lib' 2>/dev/null | head -5)
          if [[ -n "$build_dir" ]]; then
            bash scripts/lifecycle/package/archive-mod.sh \
              --id idleot --build-dir "$build_dir" \
              --out "$RUNNER_TEMP/pack/archive-idleot" \
              || echo "::warning::archive-mod.sh failed (non-fatal this run)" >&2
          else
            echo "::warning::IdleOT STATIC .a not found under build/*/mods/idleot/lib" >&2
          fi

      # Breakpad symbols for desktop crash reports (client, launcher, bundled Qt).
      # Straight to the portal's symbol store, never into an artifact or the log:
      # this repo is public. Only modules the store lacks are uploaded.
      - name: Upload desktop crash symbols
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.QTCAAC_SYMBOL_UPLOAD_TOKEN }}
          SITE: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          DUMP_SYMS_VERSION: v2.3.9
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::notice::QTCAAC_SYMBOL_UPLOAD_TOKEN not set — skip desktop symbols"
            exit 0
          fi
          case "${{ matrix.plat }}" in
            macos-arm64) asset=dump_syms-aarch64-apple-darwin.tar.xz
              sha=4945b7e5de0d7ad403822635f0fb912b69990fc412741ff2b7b512e168c40a32 ;;
            linux-x64) asset=dump_syms-x86_64-unknown-linux-gnu.tar.xz
              sha=0fc852a86b00337407d9d423cc388a24c3b489ccaaedcf92623cad57af5ca8ad ;;
            windows-x64) asset=dump_syms-x86_64-pc-windows-msvc.zip
              sha=bdf48486220708808a3e00aec78856ee1cce096189d47a1e2cb1c635f93bacc7 ;;
            *) echo "::warning::no dump_syms for ${{ matrix.plat }}"; exit 0 ;;
          esac
          dir="$RUNNER_TEMP/dump_syms"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/mozilla/dump_syms/releases/download/$DUMP_SYMS_VERSION/$asset"
          python3 -c 'import hashlib,sys; got=hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest(); sys.exit(0 if got==sys.argv[2] else "dump_syms sha256 mismatch")' \
            "$dir/$asset" "$sha"
          case "$asset" in
            *.zip) (cd "$dir" && unzip -q -o "$asset") ;;
            *) tar -xJf "$dir/$asset" -C "$dir" ;;
          esac
          bin="$(find "$dir" -type f \( -name dump_syms -o -name dump_syms.exe \) | head -1)"
          chmod +x "$bin"
          # Windows: the client's and launcher's PDBs stay in the build tree.
          pdbs=()
          while IFS= read -r pdb; do pdbs+=("$pdb"); done \
            < <(find _qtclient/build -path '*/bin/*' -name '*.pdb' 2>/dev/null)
          python3 scripts/upload-desktop-symbols.py "$bin" "$RUNNER_TEMP/pack/linked-tip" \
            ${pdbs[@]+"${pdbs[@]}"}

      - name: Save vcpkg + ccache
        if: always()
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack artifact (FS chrome)
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/idleot
          retention-days: 2
          include-hidden-files: true

      - name: Upload linked tip (engine + mods)
        uses: actions/upload-artifact@v4
        with:
          name: pack-linked-tip-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/linked-tip
          retention-days: 2
          include-hidden-files: true

      - name: Upload pack archive artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pack-archive-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/archive-idleot
          retention-days: 2
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Login GHCR (oras) for idleot push
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack to GHCR (cache for retries)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tar -czf pack.tgz -C pack idleot
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-idleot-${{ matrix.plat }}:${tag}" \
            "pack.tgz:application/vnd.oci.image.layer.v1.tar+gzip"

  pack-wasm:
    name: pack-wasm
    needs: [meta]
    if: inputs.build_wasm
    runs-on: ubuntu-24.04
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout release (cache actions + stamp script)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            scripts/stamp-mod-urls.py
          sparse-checkout-cone-mode: false

      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: idleot-client
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      # qtclient-* packages are public — pull anonymously (see pack-desktop note).
      - name: Wait + pull qtclient client-sdk
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash _qtclient/scripts/ci/pull-client-sdk.sh \
            "ghcr.io/${HOST_OWNER}/client-sdk:${{ inputs.qtclient_sha }}" \
            "$RUNNER_TEMP/client-sdk"

      - name: Resolve CIP Qt SHA
        id: cip
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./.github/actions/cache-restore
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt wasm)
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
        run: bash tools/qt/ci-setup.sh --wasm --pull-only --with-vcpkg --with-deps

      - name: Build qtclient linked tip (STATIC IdleOT)
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          VCPKG_TARGET_TRIPLET: wasm32-emscripten
          VCPKG_MANIFEST_DIR: ${{ github.workspace }}/_qtclient
          STOCK_HOST: '0'
          QTCLIENT_ENABLE_MODS: 'ON'
          QTCLIENT_LINKED_PACK: ${{ github.workspace }}/idleot-client/client
          TIBIA_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          IDLEOT_SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          TIBIA_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          IDLEOT_ASSET_BASE: ${{ vars.IDLEOT_ASSET_BASE || 'https://static.idleot.com' }}
          QTCLIENT_PAYMENTS_URL: ${{ vars.IDLEOT_PAYMENTS_URL || 'https://payments.idleot.com' }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          export TIBIA_SITE_URL IDLEOT_SITE_URL TIBIA_ASSET_BASE IDLEOT_ASSET_BASE QTCLIENT_PAYMENTS_URL
          bash scripts/lifecycle/build/wasm.sh
          bin=""
          for cand in build/tibia-wasm/bin build/tibia-wasm; do
            if [[ -f "$cand/tibia.wasm" && -f "$cand/tibia.js" ]]; then
              bin="$cand"
              break
            fi
          done
          [[ -n "$bin" ]] || {
            echo "::error::linked tip tibia.wasm missing after qtclient wasm build" >&2
            find build/tibia-wasm -name 'tibia.*' 2>/dev/null | head -40 || true
            exit 1
          }
          pack="$bin/mods/idleot"
          [[ -f "$pack/mod.json" ]] || {
            echo "::error::linked tip mods/idleot/mod.json missing (QTCLIENT_LINKED_PACK stage)" >&2
            find "$bin" -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          if [[ -d "$pack/native" ]] || find "$pack" -name 'mod.wasm' 2>/dev/null | grep -q .; then
            echo "::error::native/mod.wasm must not ship on linked tip" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/linked-tip"
          bash scripts/lifecycle/package/pack-tibia-wasm.sh "$bin" "$RUNNER_TEMP/linked-tip"
          tip_pack="$(find "$RUNNER_TEMP/linked-tip" -path '*/mods/idleot/mod.json' | head -1 | xargs dirname)"
          [[ -n "$tip_pack" && -f "$tip_pack/mod.json" ]] || tip_pack="$RUNNER_TEMP/linked-tip/mods/idleot"
          python3 "$GITHUB_WORKSPACE/scripts/stamp-mod-urls.py" "$tip_pack/mod.json" \
            --site "$TIBIA_SITE_URL" --asset "$TIBIA_ASSET_BASE" --payments "$QTCLIENT_PAYMENTS_URL"
          if grep -q '127.0.0.1' "$tip_pack/mod.json"; then
            echo "::error::wasm tip mod.json still has 127.0.0.1 after stamp" >&2
            cat "$tip_pack/mod.json" >&2
            exit 1
          fi
          # Re-fingerprint after URL stamp so /play OPFS sees the tip bytes.
          python3 - "$tip_pack" <<'PY'
          import hashlib, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          h = hashlib.sha256()
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if rel in {".pack.stamp", ".files.manifest"}:
                  continue
              h.update(rel.encode()); h.update(b"\0")
              h.update(path.read_bytes()); h.update(b"\0")
          (root / ".pack.stamp").write_text(h.hexdigest() + "\n")
          print("[pack] .pack.stamp", h.hexdigest()[:16])
          PY

      # Function names for /play crash stacks (Safari gives only wasm-function[N]).
      # Goes straight to the portal's symbol store, never into an artifact:
      # this repo is public and the symbol map names the client's functions.
      - name: Upload tibia.wasm symbol map
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.QTCAAC_SYMBOL_UPLOAD_TOKEN }}
          SITE: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::notice::QTCAAC_SYMBOL_UPLOAD_TOKEN not set — skip symbol upload"
            exit 0
          fi
          sym="$(find _qtclient/build/tibia-wasm -name tibia.js.symbols | head -1)"
          tip="$(find "$RUNNER_TEMP/linked-tip/client" -mindepth 2 -maxdepth 2 -type d -name wasm | head -1)"
          [[ -n "$sym" && -n "$tip" ]] || { echo "::warning::no tibia.js.symbols or tip dir — skip"; exit 0; }
          rev="$(basename "$(dirname "$tip")")"
          code="$(curl -sS --retry 3 --max-time 300 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -F "revision=$rev" -F "file=@$sym;filename=tibia.wasm.symbols" \
            "$SITE/api/telemetry/symbols")"
          echo "[symbols] tibia.wasm revision $rev → HTTP $code"
          [[ "$code" == 201 ]] || echo "::warning::symbol upload returned HTTP $code"

      - name: Save vcpkg + ccache
        if: always()
        uses: ./.github/actions/cache-save
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-wasm
          path: ${{ runner.temp }}/linked-tip
          retention-days: 2
          include-hidden-files: true


      - name: Login GHCR (oras) for idleot push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack-wasm to GHCR
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Build step stages the qtclient tip under linked-tip/ (artifact path).
          # ORAS cache matches desktop: pack/idleot only.
          tip_pack="$(find linked-tip -path '*/mods/idleot/mod.json' 2>/dev/null | head -1 | xargs -r dirname || true)"
          [[ -n "${tip_pack:-}" && -f "$tip_pack/mod.json" ]] || tip_pack="linked-tip/mods/idleot"
          [[ -f "$tip_pack/mod.json" ]] || {
            echo "::error::no stamped mods/idleot under linked-tip for ORAS push" >&2
            find linked-tip -path '*/mods/*' 2>/dev/null | head -40 || true
            exit 1
          }
          mkdir -p pack
          rm -rf pack/idleot
          cp -a "$tip_pack" pack/idleot
          tar -czf pack.tgz -C pack idleot
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-idleot-wasm:${tag}" \
            "pack.tgz:application/vnd.oci.image.layer.v1.tar+gzip"
