---
# Build IdleOT MODULE/SIDE_MODULE packs on **public** runners (free minutes).
# Private idleot/idleot-client has no pack compile CI — release checks it out
# with RELEASE_TOKEN after Soft client-* artifacts exist on GHCR.
#
# Compile/dep cache: Soft composites (_qtclient/.github/actions/cache-*).
# ccache scope=pack (Actions, this repo). vcpkg pulls Soft public GHCR tip.
name: Build pack

on:
  workflow_call:
    inputs:
      qtclient_sha:
        type: string
        required: true
      idleot_client_sha:
        type: string
        required: true
      build_desktop:
        type: boolean
        required: false
        default: true
      build_wasm:
        type: boolean
        required: false
        default: true
    outputs:
      pack_tag:
        value: ${{ jobs.meta.outputs.pack_tag }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  QTCLIENT_REPO: qtclient/qtclient
  IDLEOT_CLIENT_REPO: ${{ github.repository_owner }}/idleot-client
  HOST_OWNER: qtclient
  QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}

jobs:
  meta:
    name: Pack tag
    runs-on: ubuntu-latest
    outputs:
      pack_tag: ${{ steps.out.outputs.pack_tag }}
    steps:
      - id: out
        run: |
          echo "pack_tag=${{ inputs.idleot_client_sha }}-host-${{ inputs.qtclient_sha }}" >> "$GITHUB_OUTPUT"

  pack-desktop:
    name: pack-${{ matrix.plat }}
    needs: [meta]
    if: inputs.build_desktop
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            kit: linux-x64
            triplet: x64-linux-static
            os_slug: linux
          - plat: macos-arm64
            runner: macos-15
            kit: macos-arm64
            triplet: arm64-osx-static
            os_slug: macos
          - plat: windows-x64
            runner: windows-2022
            kit: windows-x64
            triplet: x64-windows-static-md
            os_slug: windows
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      # Soft client-* packages are public. Do NOT oras-login with idleot GITHUB_TOKEN
      # first — installation tokens 403 cross-org pulls even when the package is public.
      - name: Wait + pull qtclient client-sdk
        shell: bash
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash _qtclient/scripts/ci/pull-client-sdk.sh \
            "ghcr.io/${HOST_OWNER}/client-sdk:${{ inputs.qtclient_sha }}" \
            "$RUNNER_TEMP/client-sdk"

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve CIP Qt SHA
        id: cip
        shell: bash
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./_qtclient/.github/actions/cache-restore
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ github.sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt)
        shell: bash
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
        run: bash tools/qt/ci-setup.sh --pull-only --with-vcpkg --with-deps

      - name: Build pack MODULE
        shell: bash
        env:
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/tools/zstd:$PATH"
          fi
          # client-sdk ships cipgen + headers; keep _qtclient tools/qt for CIP Qt prefix.
          sdk="$RUNNER_TEMP/client-sdk"
          mkdir -p "$sdk/tools"
          rm -rf "$sdk/tools/qt"
          cp -a "$GITHUB_WORKSPACE/_qtclient/tools/qt" "$sdk/tools/qt"
          # CMAKE_PREFIX_PATH also inherits QT_PREFIX from bootstrap when qt-prefix is slow.
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          PACK_DIR=""
          while IFS= read -r line; do
            echo "$line"
            case "$line" in PACK_DIR=*) PACK_DIR="${line#PACK_DIR=}" ;; esac
          done < <(bash scripts/lifecycle/package/module.sh --client-sdk "$sdk")
          mkdir -p "$RUNNER_TEMP/pack"
          cp -a "$PACK_DIR" "$RUNNER_TEMP/pack/idleot"
          test -f "$RUNNER_TEMP/pack/idleot/mod.json"

      - name: Save vcpkg + ccache
        if: always()
        uses: ./_qtclient/.github/actions/cache-save
        with:
          kind: both
          os: ${{ matrix.os_slug }}
          triplet: ${{ matrix.triplet }}
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          # Pull Soft tip only — Soft Client:ci owns GHCR push.
          ghcr_vcpkg: ''
          unique: ${{ github.sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-${{ matrix.plat }}
          path: ${{ runner.temp }}/pack/idleot
          retention-days: 2
          include-hidden-files: true

      - name: Pack ccache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-pack-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-pack-${{ matrix.os_slug }}-${{ github.sha }}
          path: ccache-pack-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Login GHCR (oras) for idleot push
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack to GHCR (cache for retries)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tar -czf pack.tgz -C pack idleot
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-idleot-${{ matrix.plat }}:${tag}" \
            "pack.tgz:application/vnd.oci.image.layer.v1.tar+gzip"

  pack-wasm:
    name: pack-wasm
    needs: [meta]
    if: inputs.build_wasm
    runs-on: ubuntu-24.04
    environment: release
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ inputs.qtclient_sha }}
    steps:
      - name: Checkout idleot-client pack sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IDLEOT_CLIENT_REPO }}
          ref: ${{ inputs.idleot_client_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false
          submodules: false

      - name: Checkout qtclient host tree
        uses: actions/checkout@v5
        with:
          repository: ${{ env.QTCLIENT_REPO }}
          ref: ${{ inputs.qtclient_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          path: _qtclient
          persist-credentials: false
          submodules: false

      - uses: oras-project/setup-oras@v1
      - uses: lukka/get-cmake@v4.3.4

      # Soft client-* packages are public — pull anonymously (see pack-desktop note).
      - name: Wait + pull qtclient client-sdk
        run: |
          oras logout ghcr.io 2>/dev/null || true
          bash _qtclient/scripts/ci/pull-client-sdk.sh \
            "ghcr.io/${HOST_OWNER}/client-sdk:${{ inputs.qtclient_sha }}" \
            "$RUNNER_TEMP/client-sdk"

      - name: Resolve CIP Qt SHA
        id: cip
        working-directory: _qtclient
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg + ccache
        id: cache
        uses: ./_qtclient/.github/actions/cache-restore
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ghcr.io/qtclient/vcpkg-cache
          unique: ${{ github.sha }}

      - name: qtclient host bootstrap (deps + vcpkg + CIP Qt wasm)
        working-directory: _qtclient
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
        run: bash tools/qt/ci-setup.sh --wasm --pull-only --with-vcpkg --with-deps

      - name: Build SIDE_MODULE pack
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          # client-sdk + _qtclient tools/qt (emsdk / CIP Qt wasm) for SIDE_MODULE.
          sdk="$RUNNER_TEMP/client-sdk"
          mkdir -p "$sdk/tools"
          rm -rf "$sdk/tools/qt"
          cp -a "$GITHUB_WORKSPACE/_qtclient/tools/qt" "$sdk/tools/qt"
          export CMAKE_PREFIX_PATH="${QT_PREFIX}${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          PACK_DIR=""
          while IFS= read -r line; do
            echo "$line"
            case "$line" in PACK_DIR=*) PACK_DIR="${line#PACK_DIR=}" ;; esac
          done < <(bash scripts/lifecycle/package/module.sh --wasm --client-sdk "$sdk")
          mkdir -p "$RUNNER_TEMP/pack"
          cp -a "$PACK_DIR" "$RUNNER_TEMP/pack/idleot"

      - name: Save vcpkg + ccache
        if: always()
        uses: ./_qtclient/.github/actions/cache-save
        with:
          kind: both
          os: wasm
          triplet: wasm32-emscripten
          scope: pack
          vcpkg_json: _qtclient/vcpkg.json
          ghcr_vcpkg: ''
          unique: ${{ github.sha }}
          vcpkg_cache_hit: ${{ steps.cache.outputs.vcpkg-cache-hit }}
          ccache_hit: ${{ steps.cache.outputs.ccache-hit }}

      - name: Upload pack-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-idleot-wasm
          path: ${{ runner.temp }}/pack/idleot
          retention-days: 2
          include-hidden-files: true

      - name: Pack ccache
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-pack-wasm-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-pack-wasm-${{ github.sha }}
          path: ccache-pack-wasm-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Login GHCR (oras) for idleot push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push pack-wasm to GHCR
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tar -czf pack.tgz -C pack idleot
          tag="${{ needs.meta.outputs.pack_tag }}"
          oras push "ghcr.io/${{ github.repository_owner }}/pack-idleot-wasm:${tag}" \
            "pack.tgz:application/vnd.oci.image.layer.v1.tar+gzip"
