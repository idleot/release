---
# Assemble the CDN bundle from exact slice tags and push ghcr.io/idleot/cdn:<tag>.
# release.yml calls this right after the builds, before anything goes live; it
# does not deploy and does not move :latest — release.yml switches the CDN
# together with the server and portal, then moves :latest. `:latest` therefore
# always means "live".
#
# The previous tree is the live bundle (cdn:latest), so older WASM/desktop
# revisions stay reachable for clients that have not reloaded yet.
#
# Targets — repository variable IDLEOT_CDN_TARGETS (default "image"):
#   image  Coolify idleot-cdn runs ghcr.io/idleot/cdn:<tag> (cdn.idleot.com)
#   pages  GitHub Pages for this repo, same tree byte for byte (publishes on run)
#
# Slice packages are private; this repo has Actions access in each package's
# settings, so GITHUB_TOKEN reads and pushes them.
name: CDN bundle

run-name: CDN bundle ${{ inputs.release_id }}

on:
  workflow_call:
    inputs:
      wasm_tag:
        type: string
        default: latest
      desktop_tag:
        type: string
        default: latest
      assets_tag:
        type: string
        default: latest
      launcher_tag:
        type: string
        default: latest
      release_id:
        type: string
        default: ""
      publish_pages:
        type: boolean
        default: false
    outputs:
      tag:
        value: ${{ jobs.bundle.outputs.tag }}
      revision:
        description: latest/release.json revision of the bundle
        value: ${{ jobs.bundle.outputs.revision }}
  workflow_dispatch:
    inputs:
      wasm_tag:
        description: otclient-wasm tag (otclient SHA or latest)
        default: latest
      desktop_tag:
        description: otclient-desktop tag (otclient SHA or latest)
        default: latest
      assets_tag:
        description: cdn-assets tag
        default: latest
      launcher_tag:
        description: launcher tag (version or latest)
        default: latest
      release_id:
        description: Correlation id (set by release.yml)
        default: ""
      publish_pages:
        description: Deploy GitHub Pages now (when IDLEOT_CDN_TARGETS has pages)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

# Bundles stack on the previous image; never run two at once, never cancel one.
concurrency:
  group: cdn-bundle
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TARGETS: ${{ vars.IDLEOT_CDN_TARGETS || 'image' }}

jobs:
  bundle:
    name: Assemble and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract slices
        env:
          WASM_TAG: ${{ inputs.wasm_tag }}
          DESKTOP_TAG: ${{ inputs.desktop_tag }}
          ASSETS_TAG: ${{ inputs.assets_tag }}
          LAUNCHER_TAG: ${{ inputs.launcher_tag }}
        run: |
          bash scripts/extract-image.sh "$REGISTRY/cdn:latest" /usr/share/nginx/html slices/previous
          bash scripts/extract-image.sh "$REGISTRY/otclient-wasm:${WASM_TAG}" / slices/wasm
          bash scripts/extract-image.sh "$REGISTRY/otclient-desktop:${DESKTOP_TAG}" / slices/desktop
          bash scripts/extract-image.sh "$REGISTRY/cdn-assets:${ASSETS_TAG}" / slices/assets
          bash scripts/extract-image.sh "$REGISTRY/launcher:${LAUNCHER_TAG}" / slices/launcher

      - name: Assemble tree
        env:
          CDN_URL: ${{ vars.IDLEOT_CDN_URL || 'https://cdn.idleot.com' }}
        run: |
          python3 scripts/assemble.py --out site --cdn-url "$CDN_URL" \
            --previous slices/previous --wasm slices/wasm \
            --desktop slices/desktop --assets slices/assets --launcher slices/launcher
          size_mb=$(( $(du -sk site | cut -f1) / 1024 ))
          echo "Bundle size: ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt 950 ] && [[ "$TARGETS" == *pages* ]]; then
            echo "::warning::Bundle is ${size_mb} MB — GitHub Pages caps published sites at 1 GB"
          fi

      - name: Release revision
        id: revision
        run: |
          rev="$(python3 -c "import json; print(json.load(open('site/latest/release.json')).get('revision', ''))" 2>/dev/null || true)"
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"
          echo "Release revision: ${rev:-<none>}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag
        id: meta
        run: echo "tag=$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push bundle image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/cdn:${{ steps.meta.outputs.tag }}

      - name: Upload Pages artifact
        if: contains(env.TARGETS, 'pages')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Each bundle is a full copy of the tree; keep enough for rollback.
      - name: Prune old bundle versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: cdn
          package-type: container
          min-versions-to-keep: 10

  # release.yml deploys Pages itself, together with the server and portal.
  pages:
    name: Deploy GitHub Pages
    needs: [bundle]
    if: inputs.publish_pages && contains(vars.IDLEOT_CDN_TARGETS || 'image', 'pages')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
