---
# Assemble the CDN site tree from exact slice tags, push a thin nginx runtime
# image when config changes, and leave the tree for release.yml to rsync onto
# the Coolify host volume. Does not flip live CDN or move :latest.
#
# Host volume is source of truth for blobs. CI pulls only latest/ + releases/
# (~MBs) for history, assembles new slices, then sync-cdn merges additively.
#
# Targets — repository variable IDLEOT_CDN_TARGETS (default "image"):
#   image  Coolify idleot-cdn (thin runtime + /data/idleot-cdn/html volume)
#   pages  GitHub Pages for this repo (same tree)
name: CDN bundle

run-name: CDN bundle ${{ inputs.release_id }}

on:
  workflow_call:
    inputs:
      wasm_tag:
        type: string
        default: latest
      desktop_tag:
        type: string
        default: latest
      desktop_image:
        type: string
        default: ""
      assets_tag:
        type: string
        default: latest
      launcher_tag:
        type: string
        default: latest
      release_id:
        type: string
        default: ""
      publish_pages:
        type: boolean
        default: false
    outputs:
      tag:
        value: ${{ jobs.bundle.outputs.tag }}
      revision:
        description: latest/release.json revision of the bundle
        value: ${{ jobs.bundle.outputs.revision }}
      runtime_tag:
        value: ${{ jobs.bundle.outputs.runtime_tag }}
  workflow_dispatch:
    inputs:
      wasm_tag:
        description: otclient-wasm tag (otclient SHA or latest)
        default: latest
      desktop_tag:
        description: desktop slice tag (otclient SHA or latest)
        default: latest
      desktop_image:
        description: desktop slice image (default tibia-desktop)
        default: "tibia-desktop"
      assets_tag:
        description: cdn-assets tag
        default: latest
      launcher_tag:
        description: launcher tag (version or latest)
        default: latest
      release_id:
        description: Correlation id (set by release.yml)
        default: ""
      publish_pages:
        description: Deploy GitHub Pages now (when IDLEOT_CDN_TARGETS has pages)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: cdn-bundle
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TARGETS: ${{ vars.IDLEOT_CDN_TARGETS || 'image' }}

jobs:
  bundle:
    name: Assemble and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.revision.outputs.revision }}
      runtime_tag: ${{ steps.runtime.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull previous manifests
        env:
          CDN_SSH_HOST: ${{ secrets.CDN_SSH_HOST }}
          CDN_SSH_USER: ${{ secrets.CDN_SSH_USER }}
          CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
          CDN_REMOTE_ROOT: ${{ vars.CDN_REMOTE_ROOT || '/data/idleot-cdn' }}
        run: |
          # Only latest/ + releases/ (~MBs). Blobs and client/launcher trees stay on the host.
          mkdir -p slices/previous
          CDN_SSH_USER="${CDN_SSH_USER:-root}"
          if [[ -n "${CDN_SSH_HOST:-}" && -n "${CDN_SSH_KEY:-}" ]]; then
            KEY_FILE="$RUNNER_TEMP/cdn_ssh_key"
            umask 077
            printf '%s\n' "$CDN_SSH_KEY" > "$KEY_FILE"
            RSYNC_SSH="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
            for d in latest releases; do
              rsync -a -e "$RSYNC_SSH" \
                "${CDN_SSH_USER}@${CDN_SSH_HOST}:${CDN_REMOTE_ROOT}/html/${d}/" "slices/previous/${d}/" \
                || echo "::warning::no remote ${d}/ — assembling without it"
            done
            # Optional tip-of-day root file for continuity.
            rsync -a -e "$RSYNC_SSH" \
              "${CDN_SSH_USER}@${CDN_SSH_HOST}:${CDN_REMOTE_ROOT}/html/hints.json" slices/previous/hints.json \
              2>/dev/null || true
          else
            echo "::notice::CDN_SSH_* unset — cold assemble from slices only"
          fi
          du -sh slices/previous 2>/dev/null || true

      - name: Extract changed slices
        env:
          WASM_TAG: ${{ inputs.wasm_tag }}
          DESKTOP_TAG: ${{ inputs.desktop_tag }}
          DESKTOP_IMAGE: ${{ inputs.desktop_image || 'tibia-desktop' }}
          ASSETS_TAG: ${{ inputs.assets_tag }}
          LAUNCHER_TAG: ${{ inputs.launcher_tag }}
        run: |
          bash scripts/extract-image.sh "$REGISTRY/otclient-wasm:${WASM_TAG}" / slices/wasm
          bash scripts/extract-image.sh "$REGISTRY/${DESKTOP_IMAGE}:${DESKTOP_TAG}" / slices/desktop
          bash scripts/extract-image.sh "$REGISTRY/cdn-assets:${ASSETS_TAG}" / slices/assets
          bash scripts/extract-image.sh "$REGISTRY/launcher:${LAUNCHER_TAG}" / slices/launcher

      - name: Assemble tree
        env:
          CDN_URL: ${{ vars.IDLEOT_CDN_URL || 'https://cdn.idleot.com' }}
        run: |
          prev=()
          [[ -d slices/previous/latest ]] && prev=(--previous slices/previous)
          # Delta site: new slices + carried manifests. Host keeps old client/launcher blobs.
          python3 scripts/assemble.py --out site --cdn-url "$CDN_URL" \
            "${prev[@]}" --wasm slices/wasm \
            --desktop slices/desktop --assets slices/assets --launcher slices/launcher \
            --keep-wasm 2 --keep-releases 2 --keep-launcher 2
          size_mb=$(( $(du -sk site | cut -f1) / 1024 ))
          echo "Bundle size: ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt 950 ] && [[ "$TARGETS" == *pages* ]]; then
            echo "::warning::Bundle is ${size_mb} MB — GitHub Pages caps published sites at 1 GB"
          fi

      - name: Release revision
        id: revision
        run: |
          rev="$(python3 -c "import json; print(json.load(open('site/latest/release.json')).get('revision', ''))" 2>/dev/null || true)"
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"
          echo "Release revision: ${rev:-<none>}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag
        id: meta
        run: echo "tag=$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Runtime image tag
        id: runtime
        run: |
          # Content-address nginx config + Dockerfile so Coolify only redeploys when they change.
          hash="$(cat Dockerfile nginx.conf | sha256sum | cut -c1-12)"
          echo "tag=runtime-${hash}" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=runtime-${hash}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push thin runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/cdn:${{ steps.runtime.outputs.tag }}
            ${{ env.REGISTRY }}/cdn:runtime

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdn-site-${{ steps.meta.outputs.tag }}
          path: site
          include-hidden-files: true
          retention-days: 2

      - name: Upload Pages artifact
        if: contains(env.TARGETS, 'pages')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Prune old runtime tags
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: cdn
          package-type: container
          min-versions-to-keep: 15

  pages:
    name: Deploy GitHub Pages
    needs: [bundle]
    if: inputs.publish_pages && contains(vars.IDLEOT_CDN_TARGETS || 'image', 'pages')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
