---
# Release orchestrator. An idleot/idleot tag (v*) dispatches this with the tag
# as `ref`; the umbrella's submodule pointers decide what ships.
#
#   resolve -> require warm GHCR images (or build_if_missing)
#           -> bundle site tree + thin CDN runtime (exact slice tags)
#           -> close the portal login gate (client or server releases)
#           -> sync CDN volume + deploy server/portal/pages in parallel
#           -> reopen the gate once the CDN serves the new release revision
#              (any failure: roll apps back, restore previous latest/, reopen)
#           -> move :latest to what is live, GitHub Release on the umbrella tag
#
# components: auto | all | client | server | portal | launcher | server+portal | assets
# skip_build: redeploy existing images only (rollback)
# build_if_missing: compile on the release path when :<sha> is absent (default false)
name: Release

run-name: Release ${{ inputs.ref }} (${{ inputs.components }}${{ inputs.skip_build && ', no build' || '' }}${{ inputs.build_if_missing && ', build if missing' || '' }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: idleot/idleot tag (v1.2.3) or commit SHA
        required: true
      components:
        description: What to release
        type: choice
        default: auto
        options: [auto, all, client, server, portal, launcher, server+portal, assets]
      skip_build:
        description: Redeploy existing images only (rollback)
        type: boolean
        default: false
      build_if_missing:
        description: Build client/server/portal when GHCR tags are missing (slow)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release
  # A stuck Bundle (e.g. fat rsync) must not block the next cut.
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    outputs:
      release_id: ${{ steps.id.outputs.release_id }}
      otclient_sha: ${{ steps.pins.outputs.otclient_sha }}
      crystalserver_sha: ${{ steps.pins.outputs.crystalserver_sha }}
      portal_sha: ${{ steps.pins.outputs.portal_sha }}
      client: ${{ steps.pins.outputs.client }}
      server: ${{ steps.pins.outputs.server }}
      portal: ${{ steps.pins.outputs.portal }}
      launcher: ${{ steps.pins.outputs.launcher }}
      promote: ${{ steps.pins.outputs.promote }}
      build: ${{ steps.pins.outputs.build }}
      require_images: ${{ steps.pins.outputs.require_images }}
      is_tag: ${{ steps.pins.outputs.is_tag }}
      ref: ${{ steps.pins.outputs.ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Release id
        id: id
        run: echo "release_id=rel-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Resolve pins and components
        id: pins
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ inputs.ref }}
          COMPONENTS: ${{ inputs.components }}
          SKIP_BUILD: ${{ inputs.skip_build }}
          BUILD_IF_MISSING: ${{ inputs.build_if_missing }}
        run: |
          python3 scripts/resolve.py | tee "$RUNNER_TEMP/resolve.txt"
          { echo "### Release ${REF}"; echo '```'; cat "$RUNNER_TEMP/resolve.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  require-images:
    name: Require warm images
    needs: [resolve]
    if: needs.resolve.outputs.require_images == 'true' && (needs.resolve.outputs.client == 'true' || needs.resolve.outputs.server == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check :<sha> tags exist
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
          SERVER: ${{ needs.resolve.outputs.server }}
          OTC_SHA: ${{ needs.resolve.outputs.otclient_sha }}
          CRYSTAL_SHA: ${{ needs.resolve.outputs.crystalserver_sha }}
        run: bash scripts/require-images.sh

  build-client:
    name: Build client
    needs: [resolve]
    if: needs.resolve.outputs.client == 'true' && needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/build-client.yml
    secrets: inherit
    with:
      otclient_sha: ${{ needs.resolve.outputs.otclient_sha }}
      release_id: ${{ needs.resolve.outputs.release_id }}

  build-launcher:
    name: Build launcher
    needs: [resolve]
    if: needs.resolve.outputs.launcher == 'true' && needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/build-launcher.yml
    secrets: inherit
    with:
      portal_sha: ${{ needs.resolve.outputs.portal_sha }}
      release_id: ${{ needs.resolve.outputs.release_id }}

  build-server:
    name: Build server
    needs: [resolve]
    if: needs.resolve.outputs.server == 'true' && needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Dispatch crystalserver build-image and wait
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          bash scripts/dispatch-and-wait.sh "${{ github.repository_owner }}/crystalserver" build-image.yml \
            "${{ needs.resolve.outputs.release_id }}" "ref=${{ needs.resolve.outputs.crystalserver_sha }}"

  build-portal:
    name: Build portal
    needs: [resolve]
    if: needs.resolve.outputs.portal == 'true' && needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Dispatch portal build-image and wait
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          bash scripts/dispatch-and-wait.sh "${{ github.repository_owner }}/portal" build-image.yml \
            "${{ needs.resolve.outputs.release_id }}" "ref=${{ needs.resolve.outputs.portal_sha }}"

  bundle:
    name: Bundle CDN
    needs: [resolve, require-images, build-client, build-launcher, build-server, build-portal]
    if: >-
      always() && needs.resolve.outputs.promote == 'true' &&
      (needs.require-images.result == 'success' || needs.require-images.result == 'skipped') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/bundle.yml
    secrets: inherit
    with:
      wasm_tag: ${{ needs.resolve.outputs.client == 'true' && needs.resolve.outputs.otclient_sha || 'latest' }}
      desktop_tag: ${{ needs.resolve.outputs.client == 'true' && needs.resolve.outputs.otclient_sha || 'latest' }}
      desktop_image: ${{ needs.build-client.outputs.desktop_image }}
      launcher_tag: ${{ needs.build-launcher.outputs.version || 'latest' }}
      release_id: ${{ needs.resolve.outputs.release_id }}
      publish_pages: false

  close-gate:
    name: Close login gate
    needs: [resolve, require-images, build-client, build-launcher, build-server, build-portal, bundle]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.require-images.result == 'success' || needs.require-images.result == 'skipped') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    outputs:
      gated: ${{ steps.gate.outputs.gated }}
      server_tag: ${{ steps.live.outputs.server_tag }}
      portal_tag: ${{ steps.live.outputs.portal_tag }}
      cdn_runtime_tag: ${{ steps.live.outputs.cdn_runtime_tag }}
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
      RELEASE_GATE_TOKEN: ${{ secrets.RELEASE_GATE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Record what is live
        id: live
        env:
          SERVER: ${{ needs.resolve.outputs.server }}
          PORTAL: ${{ needs.resolve.outputs.portal }}
          CDN: ${{ needs.bundle.result == 'success' && contains(vars.IDLEOT_CDN_TARGETS || 'image', 'image') }}
          SERVER_APP: ${{ vars.COOLIFY_SERVER_UUID }}
          PORTAL_APP: ${{ vars.COOLIFY_PORTAL_UUID || vars.COOLIFY_AAC_UUID }}
          CDN_APP: ${{ vars.COOLIFY_CDN_UUID }}
        run: |
          if [[ "$SERVER" == true && -n "$SERVER_APP" ]]; then
            tag="$(bash scripts/coolify.sh get-env "$SERVER_APP" IMAGE_TAG)"
            echo "server_tag=${tag}" >> "$GITHUB_OUTPUT"; echo "server: ${tag:-<unset>}"
          fi
          if [[ "$PORTAL" == true && -n "$PORTAL_APP" ]]; then
            tag="$(bash scripts/coolify.sh get-image "$PORTAL_APP")"
            echo "portal_tag=${tag}" >> "$GITHUB_OUTPUT"; echo "portal: ${tag:-<unset>}"
          fi
          if [[ "$CDN" == true && -n "$CDN_APP" ]]; then
            tag="$(bash scripts/coolify.sh get-image "$CDN_APP")"
            echo "cdn_runtime_tag=${tag}" >> "$GITHUB_OUTPUT"; echo "cdn runtime: ${tag:-<unset>}"
          fi

      - name: Close
        id: gate
        if: needs.resolve.outputs.server == 'true' || needs.resolve.outputs.client == 'true'
        run: |
          if [[ -z "$RELEASE_GATE_TOKEN" ]]; then
            echo "::warning::RELEASE_GATE_TOKEN is not set — switching without the login gate"
            echo "gated=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rc=0
          bash scripts/gate.sh close || rc=$?
          case "$rc" in
            0) echo "gated=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "gated=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

  # CDN volume sync is fast (rsync deltas). Run in parallel with server/portal.
  deploy-cdn:
    name: Deploy CDN
    needs: [resolve, bundle, close-gate]
    if: >-
      always() && needs.bundle.result == 'success' && needs.close-gate.result == 'success' &&
      contains(vars.IDLEOT_CDN_TARGETS || 'image', 'image')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_DEPLOY_TIMEOUT: "600"
      COOLIFY_DEPLOY_RETRIES: "2"
      APP: ${{ vars.COOLIFY_CDN_UUID }}
      RUNTIME_TAG: ${{ needs.bundle.outputs.runtime_tag }}
      BUNDLE_TAG: ${{ needs.bundle.outputs.tag }}
      CDN_URL: ${{ vars.IDLEOT_CDN_URL || 'https://cdn.idleot.com' }}
      CDN_SSH_HOST: ${{ secrets.CDN_SSH_HOST }}
      CDN_SSH_USER: ${{ secrets.CDN_SSH_USER }}
      CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
      CDN_REMOTE_ROOT: ${{ vars.CDN_REMOTE_ROOT || '/data/idleot-cdn' }}
    steps:
      - uses: actions/checkout@v5
      - name: Download manifests
        uses: actions/download-artifact@v4
        with:
          name: cdn-site-${{ env.BUNDLE_TAG }}
          path: site
      - name: Flip latest/ on host volume
        run: |
          # Blobs were uploaded in Bundle (pre-gate). This only replaces manifests.
          export CDN_SSH_USER="${CDN_SSH_USER:-root}"
          [[ -n "$CDN_SSH_HOST" && -n "$CDN_SSH_KEY" ]] || {
            echo "::error::set CDN_SSH_HOST and CDN_SSH_KEY secrets for volume sync"
            exit 1
          }
          bash scripts/sync-cdn.sh flip site
      - name: Point idleot-cdn at thin runtime (if changed)
        run: |
          [[ -n "$APP" ]] || { echo "::error::set environment variable COOLIFY_CDN_UUID"; exit 1; }
          live="$(bash scripts/coolify.sh get-image "$APP" || true)"
          if [[ "$live" == "$RUNTIME_TAG" || "$live" == "runtime" ]]; then
            echo "[coolify] runtime already ${live} — skip image deploy"
          else
            bash scripts/coolify.sh image "$APP" "$RUNTIME_TAG"
            bash scripts/coolify.sh deploy "$APP"
          fi
      - name: Wait for the CDN
        run: |
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$CDN_URL/latest/release.json" && { echo "cdn up"; exit 0; }
            sleep 5
          done
          echo "::error::CDN did not serve latest/release.json"; exit 1

  deploy-server:
    name: Deploy server
    needs: [resolve, close-gate]
    if: always() && needs.resolve.outputs.server == 'true' && needs.close-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP: ${{ vars.COOLIFY_SERVER_UUID }}
      SHA: ${{ needs.resolve.outputs.crystalserver_sha }}
      GAME_HOST: ${{ vars.IDLEOT_GAME_HOST || 'idleot.com' }}
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require image
        run: docker buildx imagetools inspect "$REGISTRY/crystalserver:$SHA" >/dev/null
      - name: Point idleot-server at crystalserver:${{ env.SHA }}
        run: |
          [[ -n "$APP" ]] || { echo "::error::set environment variable COOLIFY_SERVER_UUID"; exit 1; }
          bash scripts/coolify.sh env "$APP" IMAGE_TAG "$SHA"
          bash scripts/coolify.sh deploy "$APP"
      - name: Wait for the game server
        run: |
          for _ in $(seq 1 30); do
            if timeout 5 bash -c "exec 3<>/dev/tcp/${GAME_HOST}/7172" 2>/dev/null; then
              echo "game port open"; exit 0
            fi
            sleep 10
          done
          echo "::error::game server did not come back on :7172"; exit 1

  deploy-portal:
    name: Deploy portal
    needs: [resolve, close-gate]
    if: always() && needs.resolve.outputs.portal == 'true' && needs.close-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP: ${{ vars.COOLIFY_PORTAL_UUID || vars.COOLIFY_AAC_UUID }}
      SHA: ${{ needs.resolve.outputs.portal_sha }}
      SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
      RELEASE_GATE_TOKEN: ${{ secrets.RELEASE_GATE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Point the portal app at portal:${{ env.SHA }}
        run: |
          [[ -n "$APP" ]] || { echo "::error::set environment variable COOLIFY_PORTAL_UUID"; exit 1; }
          if [[ -n "$RELEASE_GATE_TOKEN" ]]; then
            bash scripts/coolify.sh env "$APP" RELEASE_GATE_TOKEN "$RELEASE_GATE_TOKEN"
          fi
          bash scripts/coolify.sh image "$APP" "$SHA" "$REGISTRY/portal"
          bash scripts/coolify.sh deploy "$APP"
      - name: Wait for the site
        run: |
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$SITE_URL/" && { echo "site up"; exit 0; }
            sleep 10
          done
          echo "::error::site did not come back"; exit 1

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [bundle, close-gate]
    if: >-
      always() && needs.bundle.result == 'success' && needs.close-gate.result == 'success' &&
      contains(vars.IDLEOT_CDN_TARGETS || 'image', 'pages')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  open-gate:
    name: Open login gate
    needs: [resolve, bundle, close-gate, deploy-server, deploy-portal, deploy-cdn, deploy-pages]
    if: >-
      always() && needs.close-gate.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Open
        if: needs.close-gate.outputs.gated == 'true'
        env:
          SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          RELEASE_GATE_TOKEN: ${{ secrets.RELEASE_GATE_TOKEN }}
          EXPECT: ${{ needs.bundle.outputs.revision }}
        run: bash scripts/gate.sh open "$EXPECT"

  rollback:
    name: Roll back
    needs: [resolve, close-gate, deploy-server, deploy-portal, deploy-cdn, deploy-pages, open-gate]
    if: >-
      always() && needs.close-gate.result == 'success' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CDN_SSH_HOST: ${{ secrets.CDN_SSH_HOST }}
      CDN_SSH_USER: ${{ secrets.CDN_SSH_USER }}
      CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
      CDN_REMOTE_ROOT: ${{ vars.CDN_REMOTE_ROOT || '/data/idleot-cdn' }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore server
        if: always() && needs.deploy-server.result != 'skipped' && needs.close-gate.outputs.server_tag != ''
        env:
          APP: ${{ vars.COOLIFY_SERVER_UUID }}
          TAG: ${{ needs.close-gate.outputs.server_tag }}
        run: |
          bash scripts/coolify.sh env "$APP" IMAGE_TAG "$TAG"
          bash scripts/coolify.sh deploy "$APP"
      - name: Restore portal
        if: always() && needs.deploy-portal.result != 'skipped' && needs.close-gate.outputs.portal_tag != ''
        env:
          APP: ${{ vars.COOLIFY_PORTAL_UUID || vars.COOLIFY_AAC_UUID }}
          TAG: ${{ needs.close-gate.outputs.portal_tag }}
        run: |
          bash scripts/coolify.sh image "$APP" "$TAG"
          bash scripts/coolify.sh deploy "$APP"
      - name: Restore CDN latest/ on volume
        if: always() && needs.deploy-cdn.result != 'skipped'
        run: |
          export CDN_SSH_USER="${CDN_SSH_USER:-root}"
          if [[ -n "${CDN_SSH_HOST:-}" && -n "${CDN_SSH_KEY:-}" ]]; then
            bash scripts/sync-cdn.sh rollback || echo "::warning::CDN volume rollback failed"
          fi
          APP="${{ vars.COOLIFY_CDN_UUID }}"
          TAG="${{ needs.close-gate.outputs.cdn_runtime_tag }}"
          if [[ -n "$APP" && -n "$TAG" ]]; then
            bash scripts/coolify.sh image "$APP" "$TAG"
            bash scripts/coolify.sh deploy "$APP" || true
          fi
      - name: Pages
        if: always() && needs.deploy-pages.result == 'success'
        run: echo "::warning::GitHub Pages already serves the new bundle; rerun bundle.yml with the previous slice tags to revert it"
      - name: Reopen the gate
        if: always() && needs.close-gate.outputs.gated == 'true'
        env:
          SITE_URL: ${{ vars.IDLEOT_SITE_URL || 'https://www.idleot.com' }}
          RELEASE_GATE_TOKEN: ${{ secrets.RELEASE_GATE_TOKEN }}
        run: bash scripts/gate.sh open
      - name: Fail the release
        if: always()
        run: echo "::error::the switch failed and was rolled back"; exit 1

  finalize:
    name: Finalize
    needs: [resolve, build-client, build-launcher, bundle, close-gate, deploy-server, deploy-portal, deploy-cdn, deploy-pages, open-gate]
    if: >-
      always() && needs.resolve.result == 'success' && needs.open-gate.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move :latest to what is live
        env:
          SERVER: ${{ needs.deploy-server.result }}
          PROMOTE: ${{ needs.bundle.result }}
          CLIENT: ${{ needs.resolve.outputs.client }}
          RUNTIME_TAG: ${{ needs.bundle.outputs.runtime_tag }}
          CRYSTAL_SHA: ${{ needs.resolve.outputs.crystalserver_sha }}
          OTC_SHA: ${{ needs.resolve.outputs.otclient_sha }}
          DESKTOP_IMAGE: ${{ needs.build-client.outputs.desktop_image || 'tibia-desktop' }}
          LAUNCHER_VERSION: ${{ needs.build-launcher.outputs.version }}
        run: |
          retag() { docker buildx imagetools create -t "$REGISTRY/$1:latest" "$REGISTRY/$1:$2" && echo "$1:$2 -> latest"; }
          [[ "$SERVER" == success ]] && retag crystalserver "$CRYSTAL_SHA"
          if [[ "$PROMOTE" == success ]]; then
            if [[ "$CLIENT" == true ]]; then
              retag otclient-wasm "$OTC_SHA"
              retag "$DESKTOP_IMAGE" "$OTC_SHA"
            fi
            [[ -n "$LAUNCHER_VERSION" ]] && retag launcher "$LAUNCHER_VERSION"
            # Thin runtime: keep :runtime and :latest pointing at the live nginx image.
            [[ -n "$RUNTIME_TAG" ]] && retag cdn "$RUNTIME_TAG"
          fi
          true

      - uses: actions/checkout@v5
        if: needs.deploy-portal.result == 'success'

      - name: Move portal :latest (in idleot/portal)
        if: needs.deploy-portal.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          bash scripts/dispatch-and-wait.sh "${{ github.repository_owner }}/portal" build-image.yml \
            "${{ needs.resolve.outputs.release_id }}-latest" "ref=${{ needs.resolve.outputs.portal_sha }}" "latest=true"

      - name: GitHub Release on the umbrella tag
        if: needs.resolve.outputs.is_tag == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          notes="$(printf 'otclient %s\ncrystalserver %s\nportal %s\nclient=%s server=%s portal=%s launcher=%s cdn_runtime=%s\nrun %s/%s/actions/runs/%s\n' \
            "${{ needs.resolve.outputs.otclient_sha }}" "${{ needs.resolve.outputs.crystalserver_sha }}" \
            "${{ needs.resolve.outputs.portal_sha }}" "${{ needs.resolve.outputs.client }}" \
            "${{ needs.resolve.outputs.server }}" "${{ needs.resolve.outputs.portal }}" \
            "${{ needs.build-launcher.outputs.version || 'unchanged' }}" "${{ needs.bundle.outputs.runtime_tag }}" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          gh release create "$REF" -R "${{ github.repository_owner }}/idleot" --verify-tag --title "$REF" --notes "$notes" >/dev/null \
            || gh release edit "$REF" -R "${{ github.repository_owner }}/idleot" --notes "$notes" >/dev/null
          echo "release notes written to the umbrella tag"
