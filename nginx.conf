server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    # CORS / CORP for www.idleot.com → static.idleot.com (cdn.idleot.com alias) WASM + assets.
    # Note: add_header is NOT valid inside server-level `if` — that crashes nginx.
    # OPTIONS preflight is handled inside each location (if in location is allowed).
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # releases/<rev>/*.json file lists run to a few hundred KB raw.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # CIP tip: /hints.json (short TTL; assemble refreshes with each bundle).
    location = /hints.json {
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    # CIP tip art: /images/news/*, /images/mmorpg/*, …
    location /images/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    # Launcher self-update manifest (signed, absolute URLs) moves with releases.
    location = /launcher/latest.json {
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # CIP /launcher/tibiametadata.json + package tips (short TTL for tip files).
    location = /launcher/tibiametadata.json {
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    # launcher/<version>/ installers + signed update artifacts never change in place.
    # nginx location add_header replaces parent headers — restate COEP/CORP so
    # www.idleot.com COEP require-corp can load WASM/JS from this host.
    location /launcher/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }

    location /latest/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    location /client/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }

    # content/<aa>/<sha256> blobs, packs/<aa>/<sha256>.zip and releases/<rev>/*.json
    # lists are content- or revision-addressed (latest/release.json points at them).
    location ~ ^/(content|packs|releases)/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location /assets/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        # Fixed names across extracts (store icons, outfits/items manifest.json).
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
